<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madeca Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1e1d3a;--muted:#6b6a86;--line:#e6e4ef;--soft:#f6f5fa;--navy:#2c2b55;--navy2:#3a3970;--or:#f47b3e;--pk:#e8496b;
--libre:#2e9e6b;--cours:#f47b3e;--livree:#3d6fd1;--validee:#7b52c9;--pub:#7b52c9}
*{box-sizing:border-box}
html{scrollbar-width:none;-ms-overflow-style:none}html::-webkit-scrollbar,body::-webkit-scrollbar{display:none;width:0;height:0}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.wrap{padding:4px 2px 40px;max-width:1240px}
.hero{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(115deg,#2b2a4c 0%,#2b2a4c 58%,#353463 58%);color:#fff;padding:26px 30px 24px;min-height:150px}
.hero .eb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--or);font-weight:600}
.hero h1{font-size:32px;margin:6px 0 8px;font-weight:600;display:inline-block;border-bottom:3px solid var(--or);padding-bottom:4px}
.hero p{margin:0;color:#d8d7ee;max-width:60ch}
.hero svg.tri{position:absolute;right:46px;top:50%;transform:translateY(-50%);width:110px;height:110px;opacity:.95}
.tabs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 6px}
/* Sélecteur Bibliothèque / Apprendre masqué à la demande (réactivable : retirer .seg{display:none}) */

.tabs{justify-content:flex-end}
.seg.on{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.search{flex:1 1 240px;max-width:380px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:16px 0 6px;align-items:start}
.tools h4{margin:0 0 6px;font-size:15px}
.btn{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.or{background:var(--or)}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.small{font-size:12px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px}
.d-libre{background:var(--libre)}.d-cours{background:var(--cours)}.d-livree{background:var(--livree)}.d-validee{background:var(--validee)}.d-pub{background:var(--pub)}
.linkb{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:2px;color:var(--ink)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:16px 0 14px}

.crumb span:last-child{color:var(--ink);font-weight:500}
h2.sec{font-size:22px;margin:22px 0 4px}
.intro{color:var(--muted);margin:0 0 14px;max-width:80ch}
/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:150px;grid-auto-flow:dense;gap:12px}
.tile{position:relative;border:0;border-radius:14px;overflow:hidden;text-align:left;padding:0;color:#fff;display:block;min-width:0}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile .art{position:absolute;inset:0}
.tile .art svg{position:absolute;right:-6%;bottom:-8%;width:62%;height:auto;opacity:.35;stroke:#fff;fill:none;stroke-width:2.2}
.tile.big .art svg{width:52%;opacity:.4}
.tile .tx{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:3px}
.tile .tx b{font-size:16px;line-height:1.2;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.tile.big .tx b{font-size:24px}
.tile .tx span{font-size:12px;opacity:.92}
.tile .pill{position:absolute;top:10px;left:12px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:var(--navy);border-radius:6px;padding:1px 8px}
.tile:hover .art svg{opacity:.5;transition:opacity .2s}
.tile.off{filter:grayscale(.15)}
@media (max-width:640px){.tile.big{grid-column:span 1;grid-row:span 1}.tile.big .tx b{font-size:17px}}
/* carte des sujets */
.carte{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 26px}
.col h3{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.col h3 svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:2.4}
.suj{display:block;width:100%;border:1.5px solid var(--or);background:#fff;border-radius:6px;padding:9px 10px;margin-bottom:9px;text-align:center}
.suj:hover{background:#fff6f1}
.suj b{display:block;color:var(--or);font-weight:600;font-size:14px}
.suj .dots{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;color:var(--muted)}
.suj .dots i{margin-left:5px;font-style:normal}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}

.card:hover{box-shadow:0 6px 18px rgba(44,43,85,.12)}

.card .cb{padding:11px 13px;display:flex;flex-direction:column;gap:5px}
.soc{font-size:12px;color:#c43d5e;font-weight:600;text-decoration:none}
.fav{position:absolute;left:8px;bottom:8px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.95);color:#d99a00;font-size:17px;line-height:30px;text-align:center;cursor:pointer;border:0;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.15)}.fav.on{color:#e8a400}
.lk{position:absolute;top:8px;right:10px;background:rgba(255,255,255,.95);color:#c43d5e;font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px}
.cmt{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;margin-top:4px}
a.suj{text-decoration:none}
.suj .soc{margin-left:6px}
.wbl{font-size:12.5px;font-weight:600;color:var(--navy);margin-left:8px;text-decoration:underline;text-underline-offset:2px}
.adm{color:var(--muted);margin-left:6px}
.colhd{border:0;width:100%;text-align:left;cursor:pointer;transition:transform .15s,box-shadow .15s;position:relative;overflow:hidden;border-radius:12px;color:#fff;padding:14px 14px 12px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:10px}
.colhd svg{position:absolute;right:-8px;bottom:-12px;width:90px;opacity:.35;stroke:#fff;fill:none;stroke-width:2.2}
.colhd b{font-size:15.5px;line-height:1.2;position:relative}

.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
details.more{margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0}
/* fiche */
.fiche{border-top:5px solid var(--or);border-radius:10px;box-shadow:0 2px 14px rgba(30,29,58,.08);padding:22px 24px;max-width:900px;display:flex;flex-direction:column;gap:14px}
.fiche .hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{background:var(--navy);color:#fff;border-radius:4px;font-size:12px;padding:3px 9px}
.fiche h2{margin:0;color:var(--or);font-size:26px;line-height:1.15}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:6px 0 0}
.piste{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.piste .n{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}
.piste h4{margin:0 0 4px;font-size:15px}
.piste p{margin:0;color:var(--muted);font-size:13px;white-space:pre-line}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.libre{background:#e3f5ec;color:var(--libre)}.st.cours{background:#fff0e6;color:#c4541b}.st.livree{background:#e6eefc;color:var(--livree)}.st.validee,.st.pub{background:#efe9fb;color:var(--validee)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.box{background:var(--soft);border-radius:10px;padding:12px 14px}
.box p{margin:4px 0 0;white-space:pre-line}
.src a{color:var(--navy);word-break:break-all}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:20}
.modal{position:absolute;z-index:21;left:50%;top:24px;transform:translateX(-50%);width:min(620px,94vw);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:19px}
.modal .bd{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.f textarea{min-height:80px}
.modal footer{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.note{background:#fff8e6;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#7a5a00}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90vw}
.pbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:4px 0 16px}
.tile.add{background:#fff;border:2px dashed #cfcbe3;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.tile.add:hover{border-color:var(--or);color:var(--or)}
.tile.add .pl{font-size:34px;line-height:1;font-weight:300}
.tile.add b{font-size:14.5px}.tile.add span{font-size:12px;color:var(--muted)}
.tile.pend{background:repeating-linear-gradient(135deg,#f6f5fa 0 12px,#efedf7 12px 24px);color:var(--navy);border:1.5px dashed #b9b4d6}
.tile.pend .tx span{color:var(--muted)}
.exist{display:flex;flex-wrap:wrap;gap:6px}.exist span{background:var(--soft);border-radius:6px;font-size:12.5px;padding:4px 9px}
.sim{display:flex;flex-direction:column;gap:5px}.sim:empty{display:none}
.sim .h{font-size:12px;font-weight:600;color:#7a5a00}
.sim button{border:1px solid var(--line);background:#fffaf2;border-radius:8px;padding:6px 10px;text-align:left;font-size:12.5px}
.sim button:hover{border-color:var(--or)}
.sim div.it{border:1px solid var(--line);background:#fffaf2;border-radius:8px;padding:6px 10px;font-size:12.5px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:560px){.row3{grid-template-columns:1fr}}
.ck{display:flex;gap:8px;align-items:center;font-size:13px}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kan>div{background:var(--soft);border-radius:10px;padding:10px;min-height:120px}
.kan h5{margin:0 0 8px;font-size:13px}
.kan .it{background:#fff;border-radius:8px;padding:8px;font-size:12.5px;margin-bottom:6px;border-left:3px solid var(--or)}

/* Style épuré : cartes blanches, illustrations au trait marine avec accent orange */
.mosaic{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));grid-auto-rows:auto;gap:12px}
.tile{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:82px;color:var(--navy);cursor:pointer;overflow:visible;transition:box-shadow .15s,transform .15s,border-color .15s}
.tile:hover{box-shadow:0 6px 18px rgba(44,43,85,.09);border-color:#d6d2e6;transform:translateY(-1px)}
.tile:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.tile .art{position:relative;inset:auto;flex:0 0 54px;height:54px;border-radius:12px;display:grid;place-items:center}
.tile .art svg,.tile.big .art svg{position:static;width:34px;height:34px;opacity:1;stroke:var(--navy);fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.tile .art svg>:last-child,.card .thumb svg>:last-child{stroke:var(--or)}
.tile:hover .art svg{opacity:1}
.tile .tx{position:static;flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tile .tx b,.tile.big .tx b{font-size:15px;line-height:1.25;font-weight:600;color:var(--navy);text-shadow:none}
.tile .tx span{font-size:12.5px;color:var(--muted);opacity:1}
.tile::after{content:"›";color:#a9a6c2;font-size:24px;line-height:1;margin-left:2px}
.tile .pill{position:static;align-self:flex-start;margin-top:5px;font-style:normal;font-size:11.5px;font-weight:600;background:#fff0e6;color:#c4541b;border-radius:999px;padding:2px 10px}
.tile.big{grid-column:auto;grid-row:auto;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden}
.tile.big .art{flex:none;height:150px;border-radius:0;border-bottom:1px solid var(--line)}
.tile.big .art svg{width:104px;height:104px;stroke-width:1.7}
.tile.big .tx{padding:14px 16px 16px}
.tile.big .tx b{font-size:19px}
.tile.big::after{display:none}
.tile.add,.tile.pend{flex-direction:column;justify-content:center;text-align:center}
.tile.add::after,.tile.pend::after{display:none}
.card .thumb svg{right:16px;bottom:10px;width:62px;opacity:.95;stroke:var(--navy);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.thumb{border-bottom:1px solid var(--line)}
.colhd{color:var(--navy)}.colhd svg{stroke:var(--navy);opacity:.6}
/* Illustrations un peu plus riches : volumes blancs, accent orange doux */
.tile .art{overflow:hidden}
.tile .art::before{content:"";position:absolute;width:76%;height:76%;border-radius:50%;background:rgba(255,255,255,.7)}
.tile .art svg{position:relative;z-index:1}
.tile:not(.big) .art{flex-basis:60px;height:60px}
.tile:not(.big) .art svg{width:38px;height:38px;stroke-width:2.3}
.tile:not(.big) .art svg rect,.tile:not(.big) .art svg circle,.tile:not(.big) .art svg ellipse{fill:#fff}

.tile.big .art{height:170px}

.tile.big .art svg.ill{width:86%;height:140px;max-width:300px;stroke:var(--navy);stroke-width:1.6;fill:none}
.tile.big .art svg.ill>:last-child{fill:revert-layer}
.card .thumb{overflow:hidden}
.card .thumb::before{content:"";position:absolute;right:2px;bottom:-26px;width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.7)}
.card .thumb svg{z-index:1}
.card .thumb svg rect,.card .thumb svg circle,.card .thumb svg ellipse{fill:#fff}
.card .thumb svg>:last-child{fill:#fde3d2}
/* Style calqué sur les maquettes : scènes au trait marine, aplats orange doux, fonds dégradés pastel */
.tile:not(.big){padding:12px 16px}
.tile:not(.big) .art{flex:0 0 78px;height:52px;background:none!important;border-radius:0}
.tile:not(.big) .art::before{display:none}
.tile:not(.big) .art svg.sc{width:78px;height:46px;stroke-width:2.6}
.tile .art svg.sc>:last-child,.card .thumb svg.sc>:last-child{fill:revert-layer;stroke:revert-layer}
svg.sc{fill:none;stroke:var(--navy);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile.big .art{background:#fff!important}
.tile.big .art::before,.tile.big .art::after{display:none}
.tile .pill{background:var(--or);color:#fff}
.card .thumb{height:104px;display:flex;align-items:center;justify-content:center}

.sec{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

é et explication du rôle de chaque étape.","En cours",""],["Hydrates, paraffines et bouchons liquides","Présenter les difficultés d’écoulement rencontrées en production. Expliquer leurs conséquences et les moyens courants de prévention à partir de schémas.\nÀ intégrer au support : Fiches illustrées problème, causes, conséquences et moyens de prévention.","Disponible",""],["Eau, sels et émulsions dans le pétrole brut","Expliquer pourquoi le brut doit être déshydraté et dessalé. Présenter les émulsions, les équipements et les méthodes de séparation.\nÀ intégrer au support : Schéma de traitement et comparaison qualitative des moyens de séparation.","Disponible",""]],"c":[["Bilan matière d’un train de séparation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":13,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"FPSO","ds":"","st":"Publié","p":[["FPSO : rôle du navire et organisation des installations","Présenter les fonctions du FPSO et distinguer les équipements de procédé, les installations marines et les systèmes de stockage.\nÀ intégrer au support : Vue d’ensemble annotée et carte des principales fonctions.","Disponible",""],["Stockage du brut à bord et gestion des vapeurs","Expliquer le rôle des cuves, de l’inertage et de la récupération des vapeurs. Présenter les points de vigilance liés au stockage embarqué.\nÀ intégrer au support : Schéma simplifié des cuves et explication des systèmes associés.","Disponible",""],["Déchargement du pétrole depuis un FPSO","Présenter les équipements de transfert vers un navire export et les principales étapes d’un déchargement. Expliquer les interfaces et les arrêts de transfert.\nÀ intégrer au support : Séquence illustrée d’une opération et glossaire des équipements de transfert.","Disponible",""]],"c":[["Étude d’un séparateur triphasique",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":14,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement du gaz","ds":"","st":"Publié","p":[["Déshydratation du gaz : glycol et tamis moléculaires","Expliquer pourquoi retirer l’eau du gaz. Présenter les principes du glycol et des tamis moléculaires, ainsi que leur régénération.\nÀ intégrer au support : Deux schémas de principe et tableau comparatif des usages et limites.","Disponible",""],["Gaz acides et traitement aux amines","Présenter le CO₂ et le H₂S dans le gaz naturel. Expliquer le rôle de l’absorption et de la régénération du solvant.\nÀ intégrer au support : Schéma d’une boucle amine, vocabulaire et points de vigilance.","Disponible",""],["Condensats et point de rosée hydrocarbures","Expliquer la formation des condensats et le sens du point de rosée. Présenter les moyens de refroidissement et de séparation utilisés.\nÀ intégrer au support : Illustrations des phénomènes et schéma simplifié de récupération des liquides.","Disponible",""]],"c":[["Comparaison de deux technologies de déshydratation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":15,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eaux, torche et utilités","ds":"","st":"Publié","p":[["Eaux de production : origine, traitement et destinations","Présenter les eaux séparées du pétrole et leurs principaux contaminants. Expliquer les étapes de traitement et distinguer rejet, réutilisation et réinjection.\nÀ intégrer au support : Schéma de traitement et tableau des objectifs selon la destination.","Disponible",""],["Torche et dépressurisation : rôle des systèmes","Expliquer pourquoi une installation possède une torche. Présenter collecteur, ballon de torche et brûleur, puis distinguer décharge de sécurité et dépressurisation.\nÀ intégrer au support : Schéma annoté du système et exemples de situations d’utilisation.","Disponible",""],["Air instrument, azote et utilités d’un site Oil & Gas","Présenter les principales utilités et leurs consommateurs. Expliquer l’utilité de l’air instrument, de l’azote et des circuits de chauffage et refroidissement.\nÀ intégrer au support : Carte des utilités et fiches rôle, utilisateurs et points de vigilance.","Disponible",""]],"c":[["Analyse d’un scénario de surpression",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":17,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Distillation","ds":"","st":"Publié","p":[["Distillation atmosphérique : du brut aux différentes coupes","Expliquer le fonctionnement global de la colonne et le rôle des soutirages. Présenter les coupes obtenues et leurs usages.\nÀ intégrer au support : Schéma de colonne annoté et tableau des principales coupes.","Disponible",""],["Distillation sous vide : pourquoi abaisser la pression ?","Expliquer l’intérêt du vide pour traiter les fractions lourdes. Présenter les équipements et les différences avec la distillation atmosphérique.\nÀ intégrer au support : Schéma de principe et comparaison des deux types de distillation.","Disponible",""],["Reflux, stripping et reflux circulants","Expliquer ces trois notions à l’aide de schémas. Montrer qualitativement leur influence sur la séparation et les besoins thermiques d’une colonne.\nÀ intégrer au support : Mini-glossaire illustré et schémas montrant le rôle de chaque flux.","Disponible",""]],"c":[["Bilan simplifié d’une unité de distillation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":18,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Conversion","ds":"","st":"Publié","p":[["Craquage catalytique FCC : principe et équipements","Présenter l’objectif du FCC, les produits obtenus et le rôle du catalyseur. Expliquer le lien entre réacteur et régénérateur.\nÀ intégrer au support : Schéma annoté de l’unité et fiche des équipements et produits.","Disponible",""],["Hydrocracking : convertir les fractions lourdes","Expliquer le rôle de l’hydrogène et du catalyseur. Présenter les étapes de réaction et de séparation et les grandes familles de produits.\nÀ intégrer au support : Schéma simplifié du procédé et explication de ses principaux flux.","Disponible",""],["Reformage catalytique : objectif et fonctionnement","Présenter la transformation du naphta, l’amélioration de l’indice d’octane et la production d’hydrogène. Expliquer les équipements principaux.\nÀ intégrer au support : Schéma de procédé et glossaire des notions essentielles.","Disponible",""]],"c":[["Comparaison des objectifs et des procédés",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":19,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement","ds":"","st":"Publié","p":[["Hydrotraitement : retirer les impuretés des carburants","Expliquer les objectifs de l’hydrotraitement et le rôle de l’hydrogène. Présenter simplement réacteur, recyclage gazeux et séparation des produits.\nÀ intégrer au support : Schéma d’une unité et tableau impureté, traitement et objectif.","Disponible",""],["L’hydrogène dans une raffinerie","Identifier les unités qui produisent et consomment de l’hydrogène. Expliquer les notions de pureté, de recyclage et de réseau de distribution.\nÀ intégrer au support : Carte fonctionnelle des producteurs et consommateurs, sans bilan de réseau.","Disponible",""],["Récupération du soufre : comprendre le procédé Claus","Expliquer l’origine des gaz acides et leur destination après séparation. Présenter les étapes principales de récupération du soufre et le traitement aval.\nÀ intégrer au support : Schéma simplifié et parcours du soufre dans la chaîne de traitement.","Disponible",""]],"c":[["Lecture du PFD d’une unité d’hydrotraitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":20,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Utilités et énergie","ds":"","st":"Publié","p":[["Vapeur et condensats : comprendre un réseau industriel","Expliquer les niveaux de pression, les consommateurs et le retour des condensats. Présenter détendeurs, purgeurs et chaudières à partir d’un schéma.\nÀ intégrer au support : Schéma d’un réseau vapeur et fiches des principaux organes.","Disponible",""],["Fours de procédé : fonctionnement et points de vigilance","Présenter brûleurs, zones de chauffe et circulation des fumées. Expliquer le rôle de l’air de combustion et les principales pertes thermiques.\nÀ intégrer au support : Coupe annotée d’un four et synthèse des paramètres à surveiller.","Disponible",""],["Récupération de chaleur dans une raffinerie","Présenter les possibilités de réutiliser la chaleur entre flux. Expliquer préchauffage et intégration thermique à partir d’exemples documentaires simples.\nÀ intégrer au support : Schémas avant/après illustratifs et tableau des pistes de récupération.","Disponible",""]],"c":[["Bilan énergétique d’un réseau d’échangeurs",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":22,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Liquéfaction et FLNG","ds":"","st":"Publié","p":[["Pourquoi préparer le gaz avant sa liquéfaction ?","Identifier les composants à maîtriser avant le refroidissement cryogénique. Expliquer les problèmes qu’ils peuvent provoquer et situer les étapes de prétraitement.\nÀ intégrer au support : Tableau composant, risque et étape de traitement, avec schéma global.","Disponible",""],["Liquéfaction du gaz : comprendre les cycles de froid","Expliquer le principe d’un cycle frigorifique et son utilisation pour le GNL. Présenter quelques grandes familles de procédés avec des schémas accessibles.\nÀ intégrer au support : Schémas de principe et comparaison qualitative des cycles.","Disponible",""],["FLNG : produire du GNL sur un support flottant","Présenter les fonctions d’un FLNG et les particularités du procédé en mer. Distinguer FLNG, FPSO et terminal de liquéfaction terrestre.\nÀ intégrer au support : Vue d’ensemble annotée et tableau des fonctions et différences.","Disponible",""]],"c":[["Comparaison de principes de liquéfaction",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":23,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Stockage et transport","ds":"","st":"Publié","p":[["Réservoirs cryogéniques et stockage flottant FSU","Présenter les principaux types de stockage du GNL et le rôle de l’isolation. Expliquer la fonction d’une FSU et ses limites.\nÀ intégrer au support : Schémas des stockages et tableau terrestre/flottant.","Disponible",""],["Boil-off gas : origine et modes de gestion","Expliquer pourquoi une partie du GNL s’évapore. Présenter les destinations possibles du BOG et distinguer fonctionnement normal et protection de sécurité.\nÀ intégrer au support : Schéma des flux BOG et comparaison simple des options de gestion.","Disponible",""],["Le voyage du GNL : chargement, transport et livraison","Présenter les étapes logistiques et les équipements des méthaniers. Expliquer le retour vapeur et les opérations courantes aux terminaux.\nÀ intégrer au support : Frise illustrée du voyage et lexique des équipements de transfert.","Disponible",""]],"c":[["Bilan thermique et estimation du BOG",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":24,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Terminaux de regazéification","ds":"","st":"Publié","p":[["Vaporiseurs de GNL : technologies et sources de chaleur","Expliquer comment le GNL redevient gazeux. Comparer les principales technologies de vaporisation selon leur source de chaleur et leurs contraintes.\nÀ intégrer au support : Schémas de fonctionnement et tableau avantages, limites et usages.","Disponible",""],["Du réservoir GNL au réseau gaz","Présenter le parcours du GNL soutiré jusqu’au gaz livré. Expliquer le rôle des pompes, des vaporiseurs, du comptage et de la régulation.\nÀ intégrer au support : Schéma de la chaîne de livraison et fiches des équipements.","Disponible",""],["FSRU et terminal terrestre : différences de fonctionnement","Présenter les fonctions communes et les différences d’organisation. Expliquer les interfaces avec le navire, la terre et le réseau de gaz.\nÀ intégrer au support : Comparatif illustré et schéma fonctionnel de chaque solution.","Disponible",""]],"c":[["Bilan de regazéification et besoins thermiques",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":25,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Sécurité cryogénique et transferts","ds":"","st":"Publié","p":[["Les risques liés au froid cryogénique et aux fuites de GNL","Présenter les effets du froid, de l’épandage et de la vaporisation. Expliquer les fonctions du confinement et de la détection.\nÀ intégrer au support : Illustrations des phénomènes et tableau risque, conséquence et protection.","Disponible",""],["Sécurité d’un transfert GNL : arrêt et déconnexion","Expliquer les fonctions d’arrêt d’urgence et de déconnexion entre navire et terminal. Présenter les équipements et les échanges d’information.\nÀ intégrer au support : Séquence illustrée d’un arrêt et schéma des interfaces.","Disponible",""],["Stratification et rollover dans un stockage GNL","Expliquer simplement la formation de couches de GNL et le phénomène de rollover. Présenter les moyens de surveillance et de prévention documentés.\nÀ intégrer au support : Schémas successifs du phénomène et synthèse des points de vigilance.","Disponible",""]],"c":[["Analyse d’un scénario de surpression",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":27,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Potabilisation","ds":"","st":"Publié","p":[["Coagulation, floculation et décantation","Expliquer pourquoi certaines particules doivent être agglomérées pour être séparées. Présenter les étapes, les équipements et le rôle des réactifs.\nÀ intégrer au support : Schéma de filière et illustrations de l’évolution des particules.","Disponible",""],["Filtration et désinfection de l’eau potable","Présenter le rôle des filtres granulaires et des principaux moyens de désinfection. Expliquer leurs objectifs et leurs limites respectives.\nÀ intégrer au support : Schémas de principe et tableau des technologies et précautions.","Disponible",""],["Charbon actif et traitement des micropolluants","Expliquer l’adsorption et les usages du charbon actif. Présenter sa place dans une filière, son remplacement ou sa régénération et ses limites.\nÀ intégrer au support : Schéma de fonctionnement et fiche avantages, limites et applications.","Disponible",""]],"c":[["Comparaison de deux chaînes de traitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":28,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Dessalement et membranes","ds":"","st":"Publié","p":[["Osmose inverse : principe et composants d’une installation","Expliquer le passage de l’eau à travers la membrane sous pression. Identifier prétraitement, pompe, modules, perméat et concentrat.\nÀ intégrer au support : Schéma annoté d’un osmoseur et glossaire des principaux termes.","Disponible",""],["Microfiltration, ultrafiltration et nanofiltration","Présenter les différences entre ces familles de membranes et les séparations recherchées. Illustrer leurs usages sans entrer dans les calculs de dimensionnement.\nÀ intégrer au support : Tableau comparatif et illustrations des éléments retenus ou traversants.","Disponible",""],["Encrassement des membranes et nettoyage","Expliquer colmatage et entartrage, leurs signes et leurs conséquences. Présenter les actions préventives et les principes de nettoyage.\nÀ intégrer au support : Schémas explicatifs et tableau symptôme, cause possible et action générale.","Disponible",""]],"c":[["Bilan matière d’un osmoseur",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":29,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eaux usées et effluents","ds":"","st":"Publié","p":[["Le traitement biologique des eaux usées","Expliquer le rôle des micro-organismes et de l’aération. Présenter une filière à boues activées et le devenir de la pollution.\nÀ intégrer au support : Schéma de station et explication du rôle de chaque étape biologique.","Disponible",""],["Effluents industriels : traitements physico-chimiques","Présenter les objectifs de neutralisation, précipitation et flottation. Associer chaque procédé à des familles de polluants à partir d’exemples documentaires.\nÀ intégrer au support : Tableau polluant/procédé et schémas des principales opérations.","Disponible",""],["Boues de station : épaississement et déshydratation","Expliquer l’origine des boues et l’intérêt de réduire leur teneur en eau. Présenter les équipements courants et les filières de sortie.\nÀ intégrer au support : Parcours illustré des boues et comparatif des équipements.","Disponible",""]],"c":[["Lecture du PFD d’une station de traitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":30,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eau industrielle et réutilisation","ds":"","st":"Publié","p":[["Eau de chaudière : pourquoi et comment la traiter ?","Expliquer les exigences liées à l’usage chaudière et les problèmes d’entartrage et de corrosion. Présenter les grandes étapes de préparation de l’eau.\nÀ intégrer au support : Schéma de traitement et tableau des problèmes et moyens de prévention.","Disponible",""],["Circuits de refroidissement : appoint, évaporation et purge","Présenter les circuits ouverts et fermés et le rôle d’une tour de refroidissement. Expliquer les notions d’appoint et de purge.\nÀ intégrer au support : Schémas des circuits et vocabulaire commenté, sans bilan à calculer.","Disponible",""],["Réutiliser l’eau sur un site industriel","Présenter les usages possibles d’une eau réutilisée et l’importance d’adapter sa qualité. Rechercher des exemples publics de boucles de réutilisation.\nÀ intégrer au support : Carte illustrative des usages et fiches d’exemples sourcés.","Disponible",""]],"c":[["Bilan d’eau d’un site industriel",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":32,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Bioéthanol","ds":"","st":"Publié","p":[["Matières premières et préparation à la fermentation","Présenter les ressources sucrières, amylacées et lignocellulosiques. Expliquer les préparations nécessaires pour rendre les sucres disponibles.\nÀ intégrer au support : Tableau comparatif des ressources et schémas des préparations.","Disponible",""],["Fermentation alcoolique : produire du bioéthanol","Expliquer le rôle des levures et les principales étapes de fermentation. Présenter les conditions suivies et les facteurs qui perturbent le procédé.\nÀ intégrer au support : Schéma du fermenteur et tableau des paramètres et points de vigilance.","Disponible",""],["Distillation et déshydratation du bioéthanol","Expliquer comment séparer l’éthanol du milieu fermenté puis retirer l’eau résiduelle. Présenter les équipements et la notion d’azéotrope de manière accessible.\nÀ intégrer au support : Schéma du traitement aval et explication des étapes de séparation.","Disponible",""]],"c":[["Bilan matière d’une production simplifiée",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":33,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Biodiesel FAME","ds":"","st":"Publié","p":[["Huiles et graisses : préparation pour le biodiesel","Présenter les matières premières et leurs impuretés. Expliquer pourquoi eau, acidité et contaminants influencent le choix du prétraitement.\nÀ intégrer au support : Tableau des matières premières et schéma des étapes de préparation.","Disponible",""],["Transestérification : comprendre la production de FAME","Expliquer le rôle de l’huile, de l’alcool et du catalyseur. Présenter la réaction et les étapes de séparation et de purification.\nÀ intégrer au support : Schéma global annoté et glossaire des réactifs et produits.","Disponible",""],["Glycérine et méthanol : devenir des flux secondaires","Présenter les coproduits et les flux à recycler ou à traiter. Expliquer la récupération du méthanol et les usages possibles de la glycérine.\nÀ intégrer au support : Schéma des flux secondaires et fiches des valorisations possibles.","Disponible",""]],"c":[["Lecture et explication d’un schéma de procédé",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":34,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"HVO / diesel renouvelable","ds":"","st":"Publié","p":[["Prétraitement des matières premières HVO","Présenter les huiles et graisses utilisées et les contaminants à retirer. Expliquer les étapes de préparation et leur rôle dans la protection du catalyseur.\nÀ intégrer au support : Schéma de prétraitement et tableau contaminant, conséquence et traitement.","Disponible",""],["Hydrotraitement des lipides : de l’huile aux hydrocarbures","Expliquer le rôle de l’hydrogène et les transformations principales. Présenter les produits obtenus et les équipements de réaction et de séparation.\nÀ intégrer au support : Schéma du procédé et comparaison pédagogique HVO/FAME.","Disponible",""],["Hydroisomérisation : améliorer les propriétés à froid","Expliquer simplement les formes linéaires et ramifiées des hydrocarbures. Présenter l’intérêt de l’isomérisation et la séparation des coupes de produits.\nÀ intégrer au support : Illustrations moléculaires simples et schéma de la finition diesel.","Disponible",""]],"c":[["Comparaison FAME / diesel renouvelable",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":35,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Carburants d’aviation","ds":"","st":"Publié","p":[["HEFA : produire un carburant aviation à partir de lipides","Présenter la voie HEFA et ses matières premières. Expliquer les étapes de finition vers la coupe jet et les qualités attendues d’un carburant aviation.\nÀ intégrer au support : Schéma simplifié et tableau des étapes et objectifs, sans étude de qualification.","Disponible",""],["Alcohol-to-Jet : de l’alcool au carburant aviation","Expliquer les grandes étapes de la voie ATJ à partir d’un alcool disponible. Présenter les transformations et les séparations sans détailler les mécanismes réactionnels.\nÀ intégrer au support : Schéma de la chaîne ATJ et glossaire des principales opérations.","Disponible",""],["Fischer–Tropsch : du gaz de synthèse au carburant aviation","Présenter la production de gaz de synthèse, la conversion FT et la finition. Expliquer les grandes familles de ressources et de produits.\nÀ intégrer au support : Schéma de la filière et fiche ressources, étapes et produits.","Disponible",""]],"c":[["Comparaison de deux voies de production",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":37,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Méthanisation","ds":"","st":"Publié","p":[["Digestion anaérobie : les étapes de formation du biogaz","Expliquer le rôle des micro-organismes et les grandes étapes biologiques. Présenter les paramètres de suivi et les causes courantes de déséquilibre.\nÀ intégrer au support : Schéma des étapes biologiques et tableau des paramètres à surveiller.","Disponible",""],["Intrants de méthanisation et codigestion","Présenter les familles d’intrants, leur préparation et leur complémentarité. Expliquer les précautions liées aux indésirables et aux changements d’alimentation.\nÀ intégrer au support : Fiches d’intrants et tableau avantages et points de vigilance.","Disponible",""],["Digesteurs : voie humide, voie sèche et équipements","Comparer les grandes configurations et présenter alimentation, brassage et chauffage. Illustrer les différences d’organisation à partir d’installations documentées.\nÀ intégrer au support : Schémas de digesteurs et tableau comparatif des configurations.","Disponible",""]],"c":[["Bilan simplifié d’une installation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":38,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement du biogaz","ds":"","st":"Publié","p":[["Nettoyer le biogaz : eau, H₂S et siloxanes","Expliquer pourquoi retirer ces contaminants. Présenter les principes des traitements et les précautions de fonctionnement, sans dimensionner les équipements.\nÀ intégrer au support : Schéma de nettoyage et tableau contaminant, effet et traitement.","Disponible",""],["Retirer le CO₂ : les technologies d’épuration du biogaz","Présenter membranes, adsorption et lavage. Comparer leurs principes et leurs contraintes avec des informations accessibles dans la documentation publique.\nÀ intégrer au support : Schémas de principe et tableau comparatif qualitatif.","Disponible",""],["Pertes de méthane et gaz résiduaires d’épuration","Expliquer l’origine des gaz résiduaires et les raisons de limiter le méthane rejeté. Présenter les solutions générales de recyclage et de traitement.\nÀ intégrer au support : Schéma des flux résiduaires et synthèse des options de gestion.","Disponible",""]],"c":[["Comparaison de technologies d’épuration",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":39,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Biométhane","ds":"","st":"Publié","p":[["Injection de biométhane : du site au réseau de gaz","Présenter les fonctions du poste d’injection et les contrôles de qualité. Expliquer comptage, odorisation et gestion d’un gaz hors spécification.\nÀ intégrer au support : Schéma du poste et fiches des fonctions, avec un exemple public sourcé.","Disponible",""],["BioGNC : utiliser le biométhane comme carburant","Expliquer compression, stockage et distribution en station. Présenter les usages du bioGNC et le parcours du gaz jusqu’au véhicule.\nÀ intégrer au support : Schéma d’une station et glossaire des équipements.","Disponible",""],["BioGNL : liquéfier le biométhane pour le transporter","Présenter l’intérêt de la liquéfaction pour certains usages et les étapes de la chaîne. Comparer simplement bioGNC et bioGNL.\nÀ intégrer au support : Schéma logistique et tableau comparatif des usages et contraintes.","Disponible",""]],"c":[["Lecture d’un PFD de production de biométhane",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":40,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Valorisation énergétique et digestat","ds":"","st":"Publié","p":[["Valoriser le biogaz en chaleur","Présenter les usages en chaudière et les besoins de préparation du gaz. Illustrer les débouchés thermiques avec des exemples documentés.\nÀ intégrer au support : Schéma d’utilisation et fiches d’exemples de valorisation thermique.","Disponible",""],["Cogénération au biogaz : chaleur et électricité","Expliquer le fonctionnement d’un moteur de cogénération et les récupérations de chaleur. Présenter les usages des deux formes d’énergie.\nÀ intégrer au support : Schéma de fonctionnement et tableau des flux d’énergie et de leurs usages.","Disponible",""],["Digestat : composition, séparation et valorisation","Expliquer l’origine du digestat et la séparation de ses phases. Présenter les principales destinations et les précautions associées.\nÀ intégrer au support : Schéma du parcours du digestat et tableau des options de valorisation.","Disponible",""]],"c":[["Bilan énergétique d’un site de méthanisation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":42,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Production par électrolyse","ds":"","st":"Publié","p":[["Électrolyse alcaline : principe et équipements","Expliquer la production d’hydrogène et d’oxygène par électrolyse alcaline. Présenter cellule, électrolyte et principaux équipements auxiliaires.\nÀ intégrer au support : Schéma de cellule et vue fonctionnelle de l’installation.","Disponible",""],["Électrolyse PEM : principe et particularités","Expliquer le rôle de la membrane et le parcours des espèces dans la cellule. Présenter les différences de fonctionnement avec la technologie alcaline.\nÀ intégrer au support : Schéma de cellule et tableau comparatif PEM/alcaline.","Disponible",""],["Oxygène coproduit par électrolyse : usages et précautions","Présenter le devenir possible de l’oxygène coproduit. Expliquer les exigences de qualité selon l’usage et les précautions propres au service oxygène.\nÀ intégrer au support : Fiches d’usages documentés et synthèse des points de vigilance.","Disponible",""]],"c":[["Bilan matière d’une unité d’électrolyse",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":43,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement et compression","ds":"","st":"Publié","p":[["Séchage de l’hydrogène après production","Expliquer la présence d’eau dans l’hydrogène et les moyens de la retirer. Présenter séparation liquide et sécheurs avec leur régénération.\nÀ intégrer au support : Schéma de conditionnement et comparaison des moyens de séchage.","Disponible",""],["Purification de l’hydrogène : PSA et membranes","Expliquer les principes de séparation et les notions de pureté et de récupération. Présenter les usages et limites des deux familles de technologies.\nÀ intégrer au support : Schémas de principe, glossaire et tableau comparatif.","Disponible",""],["Compression de l’hydrogène : technologies et contraintes","Présenter les technologies utilisées et les raisons de comprimer l’hydrogène. Expliquer les enjeux d’étanchéité, d’échauffement et de refroidissement.\nÀ intégrer au support : Comparatif illustré et schéma d’une chaîne de compression.","Disponible",""]],"c":[["Lecture du PFD d’un système hydrogène",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":44,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Stockage et distribution","ds":"","st":"Publié","p":[["Stockage et transport d’hydrogène gazeux","Présenter réservoirs, cadres de bouteilles, transport routier et canalisations. Expliquer les usages et contraintes générales de chaque solution.\nÀ intégrer au support : Panorama illustré et tableau des solutions et applications.","Disponible",""],["Hydrogène liquide : stockage et logistique cryogéniques","Expliquer l’intérêt et les contraintes de la liquéfaction. Présenter réservoir, isolation, évaporation et opérations de transfert.\nÀ intégrer au support : Schéma de la chaîne logistique et synthèse des contraintes.","Disponible",""],["Ammoniac et LOHC : transporter l’hydrogène autrement","Présenter simplement le principe de ces vecteurs. Expliquer les étapes nécessaires pour charger, transporter et restituer l’hydrogène.\nÀ intégrer au support : Schémas des deux chaînes et tableau qualitatif des avantages et limites.","Disponible",""]],"c":[["Comparaison de solutions de stockage",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":45,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Intégration et sécurité","ds":"","st":"Publié","p":[["Les besoins d’une installation d’électrolyse","Identifier les besoins en électricité, eau et refroidissement. Expliquer les fonctions des utilités et les liens avec l’électrolyseur.\nÀ intégrer au support : Carte des entrées et sorties et fiches des principales utilités.","Disponible",""],["Hydrogène : fuites, ventilation et détection","Présenter les propriétés importantes pour la sécurité. Expliquer le rôle de la ventilation, des détecteurs et de l’isolement des sources de fuite.\nÀ intégrer au support : Schémas des protections et tableau danger, prévention et détection.","Disponible",""],["Les usages industriels de l’hydrogène","Présenter les usages comme matière première et comme vecteur énergétique. Expliquer les différences de besoins selon l’application, à partir d’exemples documentés.\nÀ intégrer au support : Fiches d’applications et carte des usages, sans étude de substitution.","Disponible",""]],"c":[["Analyse des interfaces et des besoins utilités",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"}];
