<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Madeca Formation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1e1d3a;--muted:#6b6a86;--line:#e6e4ef;--soft:#f6f5fa;--navy:#2c2b55;--navy2:#3a3970;--or:#f47b3e;--pk:#e8496b;
--libre:#2e9e6b;--cours:#f47b3e;--livree:#3d6fd1;--validee:#7b52c9;--pub:#7b52c9}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.wrap{padding:4px 2px 40px;max-width:1240px}
.hero{position:relative;overflow:hidden;border-radius:10px;background:linear-gradient(115deg,#2b2a4c 0%,#2b2a4c 58%,#353463 58%);color:#fff;padding:26px 30px 24px;min-height:150px}
.hero .eb{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--or);font-weight:600}
.hero h1{font-size:32px;margin:6px 0 8px;font-weight:600;display:inline-block;border-bottom:3px solid var(--or);padding-bottom:4px}
.hero p{margin:0;color:#d8d7ee;max-width:60ch}
.hero svg.tri{position:absolute;right:46px;top:50%;transform:translateY(-50%);width:110px;height:110px;opacity:.95}
.tabs{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:14px 0 6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.search{flex:1 1 240px;max-width:380px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin:16px 0 6px;align-items:start}
.tools h4{margin:0 0 6px;font-size:15px}
.btn{border:0;background:var(--navy);color:#fff;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btn.or{background:var(--or)}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.small{font-size:12px;color:var(--muted)}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:13px}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;vertical-align:-1px}
.d-libre{background:var(--libre)}.d-cours{background:var(--cours)}.d-livree{background:var(--livree)}.d-validee{background:var(--validee)}.d-pub{background:var(--pub)}
.linkb{border:0;background:none;padding:0;text-decoration:underline;text-underline-offset:2px;color:var(--ink)}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin:16px 0 14px}
.crumb button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.crumb span:last-child{color:var(--ink);font-weight:500}
h2.sec{font-size:22px;margin:22px 0 4px}
.intro{color:var(--muted);margin:0 0 14px;max-width:80ch}
/* mosaic */
.mosaic{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));grid-auto-rows:150px;grid-auto-flow:dense;gap:12px}
.tile{position:relative;border:0;border-radius:14px;overflow:hidden;text-align:left;padding:0;color:#fff;display:block;min-width:0}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile .art{position:absolute;inset:0}
.tile .art svg{position:absolute;right:-6%;bottom:-8%;width:62%;height:auto;opacity:.35;stroke:#fff;fill:none;stroke-width:2.2}
.tile.big .art svg{width:52%;opacity:.4}
.tile .tx{position:absolute;left:14px;right:14px;bottom:12px;display:flex;flex-direction:column;gap:3px}
.tile .tx b{font-size:16px;line-height:1.2;font-weight:600;text-shadow:0 1px 8px rgba(0,0,0,.18)}
.tile.big .tx b{font-size:24px}
.tile .tx span{font-size:12px;opacity:.92}
.tile .pill{position:absolute;top:10px;left:12px;font-size:11px;font-weight:600;background:rgba(255,255,255,.92);color:var(--navy);border-radius:6px;padding:1px 8px}
.tile:hover .art svg{opacity:.5;transition:opacity .2s}
.tile.off{filter:grayscale(.15)}
@media (max-width:640px){.tile.big{grid-column:span 1;grid-row:span 1}.tile.big .tx b{font-size:17px}}
/* carte des sujets */
.carte{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px 26px}
.col h3{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.col h3 svg{width:22px;height:22px;stroke:var(--or);fill:none;stroke-width:2.4}
.suj{display:block;width:100%;border:1.5px solid var(--or);background:#fff;border-radius:6px;padding:9px 10px;margin-bottom:9px;text-align:center}
.suj:hover{background:#fff6f1}
.suj b{display:block;color:var(--or);font-weight:600;font-size:14px}
.suj .dots{display:flex;justify-content:center;align-items:center;gap:4px;margin-top:3px;font-size:11.5px;color:var(--muted)}
.suj .dots i{margin-left:5px;font-style:normal}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0}
a.card{text-decoration:none;color:inherit}
.card:hover{box-shadow:0 6px 18px rgba(44,43,85,.12)}
.card .thumb{height:92px;position:relative}
.card .thumb svg{position:absolute;right:10px;bottom:-6px;width:84px;opacity:.4;stroke:#fff;fill:none;stroke-width:2.2}
.card .badge{position:absolute;top:8px;left:10px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 8px;background:rgba(255,255,255,.92)}
.card .cb{padding:11px 13px;display:flex;flex-direction:column;gap:5px}
.card .cb b{font-size:14.5px;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;font-size:11.5px;padding:2px 9px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
details.more{margin-top:24px;border-top:1px solid var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0}
/* fiche */
.fiche{border-top:5px solid var(--or);border-radius:10px;box-shadow:0 2px 14px rgba(30,29,58,.08);padding:22px 24px;max-width:900px;display:flex;flex-direction:column;gap:14px}
.fiche .hd{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tag{background:var(--navy);color:#fff;border-radius:4px;font-size:12px;padding:3px 9px}
.fiche h2{margin:0;color:var(--or);font-size:26px;line-height:1.15}
.lab{font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);margin:6px 0 0}
.piste{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.piste .n{width:30px;height:30px;border-radius:50%;background:var(--soft);display:grid;place-items:center;font-weight:700}
.piste h4{margin:0 0 4px;font-size:15px}
.piste p{margin:0;color:var(--muted);font-size:13px;white-space:pre-line}
.st{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap}
.st.libre{background:#e3f5ec;color:var(--libre)}.st.cours{background:#fff0e6;color:#c4541b}.st.livree{background:#e6eefc;color:var(--livree)}.st.validee,.st.pub{background:#efe9fb;color:var(--validee)}
.side{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.box{background:var(--soft);border-radius:10px;padding:12px 14px}
.box p{margin:4px 0 0;white-space:pre-line}
.src a{color:var(--navy);word-break:break-all}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,20,40,.4);z-index:20}
.modal{position:absolute;z-index:21;left:50%;top:24px;transform:translateX(-50%);width:min(620px,94vw);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal header h3{margin:0;font-size:19px}
.modal .bd{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.f label{display:block;font-size:12.5px;font-weight:600;margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit}
.f textarea{min-height:80px}
.modal footer{display:flex;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--line)}
.note{background:#fff8e6;border-radius:8px;padding:8px 12px;font-size:12.5px;color:#7a5a00}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:30;max-width:90vw}
.kan{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.kan>div{background:var(--soft);border-radius:10px;padding:10px;min-height:120px}
.kan h5{margin:0 0 8px;font-size:13px}
.kan .it{background:#fff;border-radius:8px;padding:8px;font-size:12.5px;margin-bottom:6px;border-left:3px solid var(--or)}
</style></head><body><div class="wrap">

ages d’un simulateur et ses principales données d’entrée. Expliquer les étapes d’un modèle à partir de captures ou tutoriels publics.\nÀ intégrer au support : Parcours illustré de création d’un modèle et présentation des résultats habituels.","Disponible",""],["Les modèles thermodynamiques : comprendre leur rôle","Expliquer pourquoi un simulateur utilise un modèle de propriétés. Présenter simplement les familles de modèles et leurs usages courants.\nÀ intégrer au support : Glossaire et tableau indicatif des domaines d’utilisation, avec sources.","Disponible",""],["Lire les résultats et repérer les incohérences","Expliquer les vérifications de base : unités, débits, températures, phases et fermeture des bilans. Distinguer convergence numérique et résultat physiquement cohérent.\nÀ intégrer au support : Exemples de tableaux de résultats commentés et liste de vérifications.","Disponible",""]],"c":[["Construire un cas HYSYS et vérifier les résultats.",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":""},{"o":9,"d":"Bases communes","f":"Bases communes du process","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Documents et régulation","ds":"","st":"Publié","p":[["PFD et P&ID : savoir les distinguer et les lire","Présenter le contenu et l’objectif des deux documents. Expliquer les symboles et repères fréquents à partir d’extraits publics simples.\nÀ intégrer au support : Deux extraits annotés, légende et tableau des différences.","Disponible",""],["Les boucles de régulation en process","Expliquer capteur, régulateur et vanne de régulation. Illustrer les boucles de pression, température, niveau et débit, avec le sens des actions.\nÀ intégrer au support : Schémas de boucles et explication d’un exemple de régulation.","Disponible",""],["Les documents produits par un ingénieur process","Présenter les listes de lignes et d’équipements, les fiches de données et les philosophies de fonctionnement. Expliquer les liens é et explication du rôle de chaque étape.","En cours",""],["Hydrates, paraffines et bouchons liquides","Présenter les difficultés d’écoulement rencontrées en production. Expliquer leurs conséquences et les moyens courants de prévention à partir de schémas.\nÀ intégrer au support : Fiches illustrées problème, causes, conséquences et moyens de prévention.","Disponible",""],["Eau, sels et émulsions dans le pétrole brut","Expliquer pourquoi le brut doit être déshydraté et dessalé. Présenter les émulsions, les équipements et les méthodes de séparation.\nÀ intégrer au support : Schéma de traitement et comparaison qualitative des moyens de séparation.","Disponible",""]],"c":[["Bilan matière d’un train de séparation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":13,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"FPSO","ds":"","st":"Publié","p":[["FPSO : rôle du navire et organisation des installations","Présenter les fonctions du FPSO et distinguer les équipements de procédé, les installations marines et les systèmes de stockage.\nÀ intégrer au support : Vue d’ensemble annotée et carte des principales fonctions.","Disponible",""],["Stockage du brut à bord et gestion des vapeurs","Expliquer le rôle des cuves, de l’inertage et de la récupération des vapeurs. Présenter les points de vigilance liés au stockage embarqué.\nÀ intégrer au support : Schéma simplifié des cuves et explication des systèmes associés.","Disponible",""],["Déchargement du pétrole depuis un FPSO","Présenter les équipements de transfert vers un navire export et les principales étapes d’un déchargement. Expliquer les interfaces et les arrêts de transfert.\nÀ intégrer au support : Séquence illustrée d’une opération et glossaire des équipements de transfert.","Disponible",""]],"c":[["Étude d’un séparateur triphasique",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":14,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement du gaz","ds":"","st":"Publié","p":[["Déshydratation du gaz : glycol et tamis moléculaires","Expliquer pourquoi retirer l’eau du gaz. Présenter les principes du glycol et des tamis moléculaires, ainsi que leur régénération.\nÀ intégrer au support : Deux schémas de principe et tableau comparatif des usages et limites.","Disponible",""],["Gaz acides et traitement aux amines","Présenter le CO₂ et le H₂S dans le gaz naturel. Expliquer le rôle de l’absorption et de la régénération du solvant.\nÀ intégrer au support : Schéma d’une boucle amine, vocabulaire et points de vigilance.","Disponible",""],["Condensats et point de rosée hydrocarbures","Expliquer la formation des condensats et le sens du point de rosée. Présenter les moyens de refroidissement et de séparation utilisés.\nÀ intégrer au support : Illustrations des phénomènes et schéma simplifié de récupération des liquides.","Disponible",""]],"c":[["Comparaison de deux technologies de déshydratation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":15,"d":"Oil & Gas","f":"Oil & Gas","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eaux, torche et utilités","ds":"","st":"Publié","p":[["Eaux de production : origine, traitement et destinations","Présenter les eaux séparées du pétrole et leurs principaux contaminants. Expliquer les étapes de traitement et distinguer rejet, réutilisation et réinjection.\nÀ intégrer au support : Schéma de traitement et tableau des objectifs selon la destination.","Disponible",""],["Torche et dépressurisation : rôle des systèmes","Expliquer pourquoi une installation possède une torche. Présenter collecteur, ballon de torche et brûleur, puis distinguer décharge de sécurité et dépressurisation.\nÀ intégrer au support : Schéma annoté du système et exemples de situations d’utilisation.","Disponible",""],["Air instrument, azote et utilités d’un site Oil & Gas","Présenter les principales utilités et leurs consommateurs. Expliquer l’utilité de l’air instrument, de l’azote et des circuits de chauffage et refroidissement.\nÀ intégrer au support : Carte des utilités et fiches rôle, utilisateurs et points de vigilance.","Disponible",""]],"c":[["Analyse d’un scénario de surpression",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"SBM Offshore - FPSO — https://www.sbmoffshore.com/what-we-do/fpso-operations/"},{"o":17,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Distillation","ds":"","st":"Publié","p":[["Distillation atmosphérique : du brut aux différentes coupes","Expliquer le fonctionnement global de la colonne et le rôle des soutirages. Présenter les coupes obtenues et leurs usages.\nÀ intégrer au support : Schéma de colonne annoté et tableau des principales coupes.","Disponible",""],["Distillation sous vide : pourquoi abaisser la pression ?","Expliquer l’intérêt du vide pour traiter les fractions lourdes. Présenter les équipements et les différences avec la distillation atmosphérique.\nÀ intégrer au support : Schéma de principe et comparaison des deux types de distillation.","Disponible",""],["Reflux, stripping et reflux circulants","Expliquer ces trois notions à l’aide de schémas. Montrer qualitativement leur influence sur la séparation et les besoins thermiques d’une colonne.\nÀ intégrer au support : Mini-glossaire illustré et schémas montrant le rôle de chaque flux.","Disponible",""]],"c":[["Bilan simplifié d’une unité de distillation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":18,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Conversion","ds":"","st":"Publié","p":[["Craquage catalytique FCC : principe et équipements","Présenter l’objectif du FCC, les produits obtenus et le rôle du catalyseur. Expliquer le lien entre réacteur et régénérateur.\nÀ intégrer au support : Schéma annoté de l’unité et fiche des équipements et produits.","Disponible",""],["Hydrocracking : convertir les fractions lourdes","Expliquer le rôle de l’hydrogène et du catalyseur. Présenter les étapes de réaction et de séparation et les grandes familles de produits.\nÀ intégrer au support : Schéma simplifié du procédé et explication de ses principaux flux.","Disponible",""],["Reformage catalytique : objectif et fonctionnement","Présenter la transformation du naphta, l’amélioration de l’indice d’octane et la production d’hydrogène. Expliquer les équipements principaux.\nÀ intégrer au support : Schéma de procédé et glossaire des notions essentielles.","Disponible",""]],"c":[["Comparaison des objectifs et des procédés",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":19,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement","ds":"","st":"Publié","p":[["Hydrotraitement : retirer les impuretés des carburants","Expliquer les objectifs de l’hydrotraitement et le rôle de l’hydrogène. Présenter simplement réacteur, recyclage gazeux et séparation des produits.\nÀ intégrer au support : Schéma d’une unité et tableau impureté, traitement et objectif.","Disponible",""],["L’hydrogène dans une raffinerie","Identifier les unités qui produisent et consomment de l’hydrogène. Expliquer les notions de pureté, de recyclage et de réseau de distribution.\nÀ intégrer au support : Carte fonctionnelle des producteurs et consommateurs, sans bilan de réseau.","Disponible",""],["Récupération du soufre : comprendre le procédé Claus","Expliquer l’origine des gaz acides et leur destination après séparation. Présenter les étapes principales de récupération du soufre et le traitement aval.\nÀ intégrer au support : Schéma simplifié et parcours du soufre dans la chaîne de traitement.","Disponible",""]],"c":[["Lecture du PFD d’une unité d’hydrotraitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":20,"d":"Raffinage","f":"Raffinage","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Utilités et énergie","ds":"","st":"Publié","p":[["Vapeur et condensats : comprendre un réseau industriel","Expliquer les niveaux de pression, les consommateurs et le retour des condensats. Présenter détendeurs, purgeurs et chaudières à partir d’un schéma.\nÀ intégrer au support : Schéma d’un réseau vapeur et fiches des principaux organes.","Disponible",""],["Fours de procédé : fonctionnement et points de vigilance","Présenter brûleurs, zones de chauffe et circulation des fumées. Expliquer le rôle de l’air de combustion et les principales pertes thermiques.\nÀ intégrer au support : Coupe annotée d’un four et synthèse des paramètres à surveiller.","Disponible",""],["Récupération de chaleur dans une raffinerie","Présenter les possibilités de réutiliser la chaleur entre flux. Expliquer préchauffage et intégration thermique à partir d’exemples documentaires simples.\nÀ intégrer au support : Schémas avant/après illustratifs et tableau des pistes de récupération.","Disponible",""]],"c":[["Bilan énergétique d’un réseau d’échangeurs",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - The refining process — https://www.eia.gov/energyexplained/oil-and-petroleum-products/refining-crude-oil-the-refining-process.php"},{"o":22,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Liquéfaction et FLNG","ds":"","st":"Publié","p":[["Pourquoi préparer le gaz avant sa liquéfaction ?","Identifier les composants à maîtriser avant le refroidissement cryogénique. Expliquer les problèmes qu’ils peuvent provoquer et situer les étapes de prétraitement.\nÀ intégrer au support : Tableau composant, risque et étape de traitement, avec schéma global.","Disponible",""],["Liquéfaction du gaz : comprendre les cycles de froid","Expliquer le principe d’un cycle frigorifique et son utilisation pour le GNL. Présenter quelques grandes familles de procédés avec des schémas accessibles.\nÀ intégrer au support : Schémas de principe et comparaison qualitative des cycles.","Disponible",""],["FLNG : produire du GNL sur un support flottant","Présenter les fonctions d’un FLNG et les particularités du procédé en mer. Distinguer FLNG, FPSO et terminal de liquéfaction terrestre.\nÀ intégrer au support : Vue d’ensemble annotée et tableau des fonctions et différences.","Disponible",""]],"c":[["Comparaison de principes de liquéfaction",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":23,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Stockage et transport","ds":"","st":"Publié","p":[["Réservoirs cryogéniques et stockage flottant FSU","Présenter les principaux types de stockage du GNL et le rôle de l’isolation. Expliquer la fonction d’une FSU et ses limites.\nÀ intégrer au support : Schémas des stockages et tableau terrestre/flottant.","Disponible",""],["Boil-off gas : origine et modes de gestion","Expliquer pourquoi une partie du GNL s’évapore. Présenter les destinations possibles du BOG et distinguer fonctionnement normal et protection de sécurité.\nÀ intégrer au support : Schéma des flux BOG et comparaison simple des options de gestion.","Disponible",""],["Le voyage du GNL : chargement, transport et livraison","Présenter les étapes logistiques et les équipements des méthaniers. Expliquer le retour vapeur et les opérations courantes aux terminaux.\nÀ intégrer au support : Frise illustrée du voyage et lexique des équipements de transfert.","Disponible",""]],"c":[["Bilan thermique et estimation du BOG",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":24,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Terminaux de regazéification","ds":"","st":"Publié","p":[["Vaporiseurs de GNL : technologies et sources de chaleur","Expliquer comment le GNL redevient gazeux. Comparer les principales technologies de vaporisation selon leur source de chaleur et leurs contraintes.\nÀ intégrer au support : Schémas de fonctionnement et tableau avantages, limites et usages.","Disponible",""],["Du réservoir GNL au réseau gaz","Présenter le parcours du GNL soutiré jusqu’au gaz livré. Expliquer le rôle des pompes, des vaporiseurs, du comptage et de la régulation.\nÀ intégrer au support : Schéma de la chaîne de livraison et fiches des équipements.","Disponible",""],["FSRU et terminal terrestre : différences de fonctionnement","Présenter les fonctions communes et les différences d’organisation. Expliquer les interfaces avec le navire, la terre et le réseau de gaz.\nÀ intégrer au support : Comparatif illustré et schéma fonctionnel de chaque solution.","Disponible",""]],"c":[["Bilan de regazéification et besoins thermiques",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":25,"d":"LNG / GNL","f":"LNG / GNL","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Sécurité cryogénique et transferts","ds":"","st":"Publié","p":[["Les risques liés au froid cryogénique et aux fuites de GNL","Présenter les effets du froid, de l’épandage et de la vaporisation. Expliquer les fonctions du confinement et de la détection.\nÀ intégrer au support : Illustrations des phénomènes et tableau risque, conséquence et protection.","Disponible",""],["Sécurité d’un transfert GNL : arrêt et déconnexion","Expliquer les fonctions d’arrêt d’urgence et de déconnexion entre navire et terminal. Présenter les équipements et les échanges d’information.\nÀ intégrer au support : Séquence illustrée d’un arrêt et schéma des interfaces.","Disponible",""],["Stratification et rollover dans un stockage GNL","Expliquer simplement la formation de couches de GNL et le phénomène de rollover. Présenter les moyens de surveillance et de prévention documentés.\nÀ intégrer au support : Schémas successifs du phénomène et synthèse des points de vigilance.","Disponible",""]],"c":[["Analyse d’un scénario de surpression",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Offshore LNG technologies — https://www.energy.gov/hgeo/articles/offshore-lng-technologies-facilities\nMOL - FSU — https://www.mol-service.com/glossary/fsu\nExcelerate - FSRU — https://excelerateenergy.com/our-operations/floating-lng-terminals/"},{"o":27,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Potabilisation","ds":"","st":"Publié","p":[["Coagulation, floculation et décantation","Expliquer pourquoi certaines particules doivent être agglomérées pour être séparées. Présenter les étapes, les équipements et le rôle des réactifs.\nÀ intégrer au support : Schéma de filière et illustrations de l’évolution des particules.","Disponible",""],["Filtration et désinfection de l’eau potable","Présenter le rôle des filtres granulaires et des principaux moyens de désinfection. Expliquer leurs objectifs et leurs limites respectives.\nÀ intégrer au support : Schémas de principe et tableau des technologies et précautions.","Disponible",""],["Charbon actif et traitement des micropolluants","Expliquer l’adsorption et les usages du charbon actif. Présenter sa place dans une filière, son remplacement ou sa régénération et ses limites.\nÀ intégrer au support : Schéma de fonctionnement et fiche avantages, limites et applications.","Disponible",""]],"c":[["Comparaison de deux chaînes de traitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":28,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Dessalement et membranes","ds":"","st":"Publié","p":[["Osmose inverse : principe et composants d’une installation","Expliquer le passage de l’eau à travers la membrane sous pression. Identifier prétraitement, pompe, modules, perméat et concentrat.\nÀ intégrer au support : Schéma annoté d’un osmoseur et glossaire des principaux termes.","Disponible",""],["Microfiltration, ultrafiltration et nanofiltration","Présenter les différences entre ces familles de membranes et les séparations recherchées. Illustrer leurs usages sans entrer dans les calculs de dimensionnement.\nÀ intégrer au support : Tableau comparatif et illustrations des éléments retenus ou traversants.","Disponible",""],["Encrassement des membranes et nettoyage","Expliquer colmatage et entartrage, leurs signes et leurs conséquences. Présenter les actions préventives et les principes de nettoyage.\nÀ intégrer au support : Schémas explicatifs et tableau symptôme, cause possible et action générale.","Disponible",""]],"c":[["Bilan matière d’un osmoseur",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":29,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eaux usées et effluents","ds":"","st":"Publié","p":[["Le traitement biologique des eaux usées","Expliquer le rôle des micro-organismes et de l’aération. Présenter une filière à boues activées et le devenir de la pollution.\nÀ intégrer au support : Schéma de station et explication du rôle de chaque étape biologique.","Disponible",""],["Effluents industriels : traitements physico-chimiques","Présenter les objectifs de neutralisation, précipitation et flottation. Associer chaque procédé à des familles de polluants à partir d’exemples documentaires.\nÀ intégrer au support : Tableau polluant/procédé et schémas des principales opérations.","Disponible",""],["Boues de station : épaississement et déshydratation","Expliquer l’origine des boues et l’intérêt de réduire leur teneur en eau. Présenter les équipements courants et les filières de sortie.\nÀ intégrer au support : Parcours illustré des boues et comparatif des équipements.","Disponible",""]],"c":[["Lecture du PFD d’une station de traitement",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":30,"d":"Traitement de l’eau","f":"Traitement de l’eau","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Eau industrielle et réutilisation","ds":"","st":"Publié","p":[["Eau de chaudière : pourquoi et comment la traiter ?","Expliquer les exigences liées à l’usage chaudière et les problèmes d’entartrage et de corrosion. Présenter les grandes étapes de préparation de l’eau.\nÀ intégrer au support : Schéma de traitement et tableau des problèmes et moyens de prévention.","Disponible",""],["Circuits de refroidissement : appoint, évaporation et purge","Présenter les circuits ouverts et fermés et le rôle d’une tour de refroidissement. Expliquer les notions d’appoint et de purge.\nÀ intégrer au support : Schémas des circuits et vocabulaire commenté, sans bilan à calculer.","Disponible",""],["Réutiliser l’eau sur un site industriel","Présenter les usages possibles d’une eau réutilisée et l’importance d’adapter sa qualité. Rechercher des exemples publics de boucles de réutilisation.\nÀ intégrer au support : Carte illustrative des usages et fiches d’exemples sourcés.","Disponible",""]],"c":[["Bilan d’eau d’un site industriel",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Drinking water treatment technologies — https://www.epa.gov/sdwa/overview-drinking-water-treatment-technologies\nCDC - How water treatment works — https://www.cdc.gov/drinking-water/about/how-water-treatment-works.html"},{"o":32,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Bioéthanol","ds":"","st":"Publié","p":[["Matières premières et préparation à la fermentation","Présenter les ressources sucrières, amylacées et lignocellulosiques. Expliquer les préparations nécessaires pour rendre les sucres disponibles.\nÀ intégrer au support : Tableau comparatif des ressources et schémas des préparations.","Disponible",""],["Fermentation alcoolique : produire du bioéthanol","Expliquer le rôle des levures et les principales étapes de fermentation. Présenter les conditions suivies et les facteurs qui perturbent le procédé.\nÀ intégrer au support : Schéma du fermenteur et tableau des paramètres et points de vigilance.","Disponible",""],["Distillation et déshydratation du bioéthanol","Expliquer comment séparer l’éthanol du milieu fermenté puis retirer l’eau résiduelle. Présenter les équipements et la notion d’azéotrope de manière accessible.\nÀ intégrer au support : Schéma du traitement aval et explication des étapes de séparation.","Disponible",""]],"c":[["Bilan matière d’une production simplifiée",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":33,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Biodiesel FAME","ds":"","st":"Publié","p":[["Huiles et graisses : préparation pour le biodiesel","Présenter les matières premières et leurs impuretés. Expliquer pourquoi eau, acidité et contaminants influencent le choix du prétraitement.\nÀ intégrer au support : Tableau des matières premières et schéma des étapes de préparation.","Disponible",""],["Transestérification : comprendre la production de FAME","Expliquer le rôle de l’huile, de l’alcool et du catalyseur. Présenter la réaction "]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":35,"d":"Énergies alternatives","f":"Biocarburants","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Carburants d’aviation","ds":"","st":"Publié","p":[["HEFA : produire un carburant aviation à partir de lipides","Présenter la voie HEFA et ses matières premières. Expliquer les étapes de finition vers la coupe jet et les qualités attendues d’un carburant aviation.\nÀ intégrer au support : Schéma simplifié et tableau des étapes et objectifs, sans étude de qualification.","Disponible",""],["Alcohol-to-Jet : de l’alcool au carburant aviation","Expliquer les grandes étapes de la voie ATJ à partir d’un alcool disponible. Présenter les transformations et les séparations sans détailler les mécanismes réactionnels.\nÀ intégrer au support : Schéma de la chaîne ATJ et glossaire des principales opérations.","Disponible",""],["Fischer–Tropsch : du gaz de synthèse au carburant aviation","Présenter la production de gaz de synthèse, la conversion FT et la finition. Expliquer les grandes familles de ressources et de produits.\nÀ intégrer au support : Schéma de la filière et fiche ressources, étapes et produits.","Disponible",""]],"c":[["Comparaison de deux voies de production",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"EIA - Biodiesel and renewable diesel — https://www.eia.gov/energyexplained/biofuels/biodiesel-rd-other-basics.php\nIEA - Biofuels — https://www.iea.org/energy-system/low-emissions-fuels/biofuels"},{"o":37,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Méthanisation","ds":"","st":"Publié","p":[["Digestion anaérobie : les étapes de formation du biogaz","Expliquer le rôl litatif.","Disponible",""],["Pertes de méthane et gaz résiduaires d’épuration","Expliquer l’origine des gaz résiduaires et les raisons de limiter le méthane rejeté. Présenter les solutions générales de recyclage et de traitement.\nÀ intégrer au support : Schéma des flux résiduaires et synthèse des options de gestion.","Disponible",""]],"c":[["Comparaison de technologies d’épuration",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":39,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Biométhane","ds":"","st":"Publié","p":[["Injection de biométhane : du site au réseau de gaz","Présenter les fonctions du poste d’injection et les contrôles de qualité. Expliquer comptage, odorisation et gestion d’un gaz hors spécification.\nÀ intégrer au support : Schéma du poste et fiches des fonctions, avec un exemple public sourcé.","Disponible",""],["BioGNC : utiliser le biométhane comme carburant","Expliquer compression, stockage et distribution en station. Présenter les usages du bioGNC et le parcours du gaz jusqu’au véhicule.\nÀ intégrer au support : Schéma d’une station et glossaire des équipements.","Disponible",""],["BioGNL : liquéfier le biométhane pour le transporter","Présenter l’intérêt de la liquéfaction pour certains usages et les étapes de la chaîne. Comparer simplement bioGNC et bioGNL.\nÀ intégrer au support : Schéma logistique et tableau comparatif des usages et contraintes.","Disponible",""]],"c":[["Lecture d’un PFD de production de biométhane",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":40,"d":"Énergies alternatives","f":"Biogaz","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Valorisation énergétique et digestat","ds":"","st":"Publié","p":[["Valoriser le biogaz en chaleur","Présenter les usages en chaudière et les besoins de préparation du gaz. Illustrer les débouchés thermiques avec des exemples documentés.\nÀ intégrer au support : Schéma d’utilisation et fiches d’exemples de valorisation thermique.","Disponible",""],["Cogénération au biogaz : chaleur et électricité","Expliquer le fonctionnement d’un moteur de cogénération et les récupérations de chaleur. Présenter les usages des deux formes d’énergie.\nÀ intégrer au support : Schéma de fonctionnement et tableau des flux d’énergie et de leurs usages.","Disponible",""],["Digestat : composition, séparation et valorisation","Expliquer l’origine du digestat et la séparation de ses phases. Présenter les principales destinations et les précautions associées.\nÀ intégrer au support : Schéma du parcours du digestat et tableau des options de valorisation.","Disponible",""]],"c":[["Bilan énergétique d’un site de méthanisation",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"US EPA - Anaerobic digestion — https://www.epa.gov/agstar/how-does-anaerobic-digestion-work\nUS EPA - Renewable natural gas — https://www.epa.gov/agstar/renewable-natural-gas-agricultural-based-adbiogas-systems"},{"o":42,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Production par électrolyse","ds":"","st":"Publié","p":[["Électrolyse alcaline : principe et équipements","Expliquer la production d’hydrogène et d’oxygène par électrolyse alcaline. Présenter cellule, électrolyte et principaux équipements auxiliaires.\nÀ intégrer au support : Schéma de cellule et vue fonctionnelle de l’installation.","Disponible",""],["Électrolyse PEM : principe et particularités","Expliquer le rôle de la membrane et le parcours des espèces dans la cellule. Présenter les différences de fonctionnement avec la technologie alcaline.\nÀ intégrer au support : Schéma de cellule et tableau comparatif PEM/alcaline.","Disponible",""],["Oxygène coproduit par électrolyse : usages et précautions","Présenter le devenir possible de l’oxygène coproduit. Expliquer les exigences de qualité selon l’usage et les précautions propres au service oxygène.\nÀ intégrer au support : Fiches d’usages documentés et synthèse des points de vigilance.","Disponible",""]],"c":[["Bilan matière d’une unité d’électrolyse",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":43,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Traitement et compression","ds":"","st":"Publié","p":[["Séchage de l’hydrogène après production","Expliquer la présence d’eau dans l’hydrogène et les moyens de la retirer. Présenter séparation liquide et sécheurs avec leur régénération.\nÀ intégrer au support : Schéma de conditionnement et comparaison des moyens de séchage.","Disponible",""],["Purification de l’hydrogène : PSA et membranes","Expliquer les principes de séparation et les notions de pureté et de récupération. Présenter les usages et limites des deux familles de technologies.\nÀ intégrer au support : Schémas de principe, glossaire et tableau comparatif.","Disponible",""],["Compression de l’hydrogène : technologies et contraintes","Présenter les technologies utilisées et les raisons de comprimer l’hydrogène. Expliquer les enjeux d’étanchéité, d’échauffement et de refroidissement.\nÀ intégrer au support : Comparatif illustré et schéma d’une chaîne de compression.","Disponible",""]],"c":[["Lecture du PFD d’un système hydrogène",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":44,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Stockage et distribution","ds":"","st":"Publié","p":[["Stockage et transport d’hydrogène gazeux","Présenter réservoirs, cadres de bouteilles, transport routier et canalisations. Expliquer les usages et contraintes générales de chaque solution.\nÀ intégrer au support : Panorama illustré et tableau des solutions et applications.","Disponible",""],["Hydrogène liquide : stockage et logistique cryogéniques","Expliquer l’intérêt et les contraintes de la liquéfaction. Présenter réservoir, isolation, évaporation et opérations de transfert.\nÀ intégrer au support : Schéma de la chaîne logistique et synthèse des contraintes.","Disponible",""],["Ammoniac et LOHC : transporter l’hydrogène autrement","Présenter simplement le principe de ces vecteurs. Expliquer les étapes nécessaires pour charger, transporter et restituer l’hydrogène.\nÀ intégrer au support : Schémas des deux chaînes et tableau qualitatif des avantages et limites.","Disponible",""]],"c":[["Comparaison de solutions de stockage",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"},{"o":45,"d":"Énergies alternatives","f":"Hydrogène","s":"Énergie & Industrie","di":"Génie des Procédés","t":"Intégration et sécurité","ds":"","st":"Publié","p":[["Les besoins d’une installation d’électrolyse","Identifier les besoins en électricité, eau et refroidissement. Expliquer les fonctions des utilités et les liens avec l’électrolyseur.\nÀ intégrer au support : Carte des entrées et sorties et fiches des principales utilités.","Disponible",""],["Hydrogène : fuites, ventilation et détection","Présenter les propriétés importantes pour la sécurité. Expliquer le rôle de la ventilation, des détecteurs et de l’isolement des sources de fuite.\nÀ intégrer au support : Schémas des protections et tableau danger, prévention et détection.","Disponible",""],["Les usages industriels de l’hydrogène","Présenter les usages comme matière première et comme vecteur énergétique. Expliquer les différences de besoins selon l’application, à partir d’exemples documentés.\nÀ intégrer au support : Fiches d’applications et carte des usages, sans étude de substitution.","Disponible",""]],"c":[["Analyse des interfaces et des besoins utilités",null,"Disponible"]],"l":["Présentation technique","Fiche pour les recruteurs","Calcul ou schéma"],"so":"U.S. DOE - Hydrogen production: electrolysis — https://www.energy.gov/cmei/fuels/hydrogen-production-electrolysis"}];

function pst(p){const pub=PUBT.get(norm(p[0]));if(pub)return{k:"pub",l:"Publiée",pub};const s=(p[2]||"").toLowerCase();if(s.includes("cours"))return{k:"cours",l:"En cours"};if(s.includes("livr"))return{k:"livree",l:"Livrée"};if(s.includes("valid"))return{k:"validee",l:"Validée"};return{k:"libre",l:"Libre"}}
let S={mode:location.hash.slice(1)==="apprendre"?"apprendre":"formations",path:[],sel:null,lv:"",q:"",free:true};try{const r=JSON.parse(sessionStorage.getItem("mfS")||"null");if(r){sessionStorage.removeItem("mfS");if(r.mode===S.mode){S.path=r.path;S.sel=r.sel}}}catch(e){}
const $=s=>document.querySelector(s);const WB=(()=>{try{const u=new URL(document.referrer);if(/wobee\.fr$/.test(u.hostname))return u.origin}catch(e){}return "https://madeca.wobee.fr"})();document.addEventListener("click",e=>{if(e.target.closest("[data-wb]"))try{sessionStorage.setItem("mfS",JSON.stringify({mode:S.mode,path:S.path,sel:S.sel}))}catch(_){}},true);let LY=0;document.addEventListener("click",e=>{LY=e.pageY},true);function place(){const m=document.querySelector(".modal");if(m)m.style.top=Math.max(16,LY-180)+"px"}
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function items(n){return Array.isArray(n)?[n]:n.k.flatMap(items)}
function pubIn(n){return items(n).reduce((a,f)=>a+(PUBBY[f[0]]||[]).length,0)}
function nodeAt(path){let lvl=TREE,out=[];for(const c of path){const n=lvl.find(x=>x.c===c);if(!n)break;out.push(n);lvl=n.k}return out}
function hero(){const A=S.mode==="apprendre";$("#hero").innerHTML=`<div class="hero"><div class="eb">${A?"Apprendre et transmettre · Madeca Formation":"Bibliothèque · Madeca Formation"}</div><h1>${A?"Carte des sujets":"Bibliothèque de formation"}</h1><p>${A?"Choisis un sujet, ouvre sa fiche et engage-toi sur une piste : présentation, cas pratique, livrable.":"Toutes les formations publiées par les consultants Madeca, rangées par domaine et par métier."}</p><svg class="tri" viewBox="0 0 100 100" fill="none" stroke="#f47b3e" stroke-width="5"><path d="M16 10L90 50 16 90z"/></svg></div>`}
function crumb(ns){let h=`<nav class="crumb"><button data-go="-1">${S.mode==="formations"?"Bibliothèque":"Apprendre et transmettre"}</button>`;ns.forEach((n,i)=>{h+=`<span>›</span>`+(i<ns.length-1||S.sel?`<button data-go="${i}">${esc(n.n)}</button>`:`<span>${esc(n.n)}</span>`)});if(S.sel)h+=`<span>›</span><span>${esc(S.sel.title)}</span>`;return h+"</nav>"}
function tile(code,name,sub,big,pill,attr){return `<button class="tile${big?" big":""}" ${attr} style="background:${gradOf(code)}"><div class="art"><svg viewBox="0 0 64 64">${iconOf(code)}</svg></div>${pill?`<span class="pill">${pill}</span>`:""}<div class="tx"><b>${esc(name)}</b><span>${sub}</span></div></button>`}
function tools(){return `<div class="tools"><div><button class="btn or" data-propose>＋ Proposer un sujet</button><p class="small" style="margin:6px 0 0">Validé par un référent avant d’apparaître sur la carte.</p></div><div><h4>Mon suivi</h4><button class="linkb" data-suivi>Mes sujets</button> · <button class="linkb" data-suivi>Tableau de suivi des pistes</button> · <button class="linkb" data-depotg>Déposer un livrable</button></div><div><h4>Légende</h4><div class="lg"><span><span class="dot d-libre"></span> Libre</span><span><span class="dot d-cours"></span> En cours</span><span><span class="dot d-livree"></span> Livrée</span><span><span class="dot d-validee"></span> Validée / publiée</span></div></div></div>`}
function render(){
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.mode));hero();
 if(S.q)return renderSearch();
 if(S.sel)return S.sel.kind==="sp"?renderSP():renderDetail();
 const ns=nodeAt(S.path),cur=ns[ns.length-1],kids=cur?cur.k:TREE,leaf=kids.length&&Array.isArray(kids[0]);const F=S.mode==="formations";
 let h=(F?"":tools())+crumb(ns);
 if(!F&&!cur&&SP.length){h+=`<h2 class="sec">Génie des procédés · sujets à transmettre</h2>`+carte()+`<details class="more"><summary>Explorer tout le référentiel (autres métiers)</summary><div style="margin-top:12px">${mosaicOf(kids,true)}</div></details>`;$("#main").innerHTML=h;bind();return}
 if(cur)h+=`<h2 class="sec">${esc(cur.n)}</h2>${cur.d?`<p class="intro">${esc(cur.d)}</p>`:""}`;
 if(!F&&cur&&cur.c==="EI-PRO"&&SP.length){h+=carte();h+=`<details class="more"><summary>Tous les thèmes du référentiel Génie des procédés (${items(cur).length} sujets)</summary><div style="margin-top:12px">${mosaicOf(kids,false)}</div></details>`}
 else if(!leaf){h+=mosaicOf(kids,!cur)}
 else{
  if(F){const list=kids.flatMap(f=>(PUBBY[f[0]]||[]).map(p=>({p,f})));h+=list.length?`<div class="grid">`+list.map(({p,f})=>pubCard(p,f)).join("")+`</div>`:`<div class="box" style="text-align:center;padding:26px">Aucune formation publiée dans ce thème pour l’instant.<br><br><button class="btn o" data-switch="apprendre">Voir les sujets à transmettre</button></div>`}
  else{h+=`<div class="filters">`+["","F","A","E"].map(l=>`<button data-lv="${l}" aria-pressed="${S.lv===l}">${l?LV[l]:"Tous niveaux"}</button>`).join("")+`</div><div class="grid">`+kids.filter(f=>!S.lv||f[2]===S.lv).map(topicCard).join("")+`</div>`}
 }
 $("#main").innerHTML=h;bind();
}
function mosaicOf(kids,root){const F=S.mode==="formations";return `<div class="mosaic">`+kids.map((k,i)=>{const p=pubIn(k),t=items(k).length;let sub=F?(p?`${p} formation${p>1?"s":""} publiée${p>1?"s":""}`:"Bientôt"):`${t} sujets`;if(!F&&k.c==="EI-PRO"&&SP.length)sub=`Carte des sujets · ${SP.length} sujets`;const big=root?i===0:(i===0&&kids.length>3);return tile(k.c,k.n,sub,big,p&&!F?`${p} publiée${p>1?"s":""}`:(F&&p?"Disponible":""),`data-open="${k.c}"`)}).join("")+`</div>`}
function carte(){const groups=[];SP.slice().sort((a,b)=>(a.o||0)-(b.o||0)).filter(s=>!S.free||s.p.some(p=>pst(p).k==="libre")).forEach(s=>{let g=groups.find(x=>x.n===s.d);if(!g){g={n:s.d,l:[]};groups.push(g)}g.l.push(s)});
 return `<p class="intro">Chaque sujet propose plusieurs pistes. Ouvre un sujet, prends une piste libre, et dépose ton livrable par ticket quand c’est prêt.</p><div class="filters"><button data-free="1" aria-pressed="${!!S.free}">Seulement les sujets avec des pistes libres</button><button data-free="0" aria-pressed="${!S.free}">Tous les sujets</button></div><div class="carte">`+groups.map(g=>`<div class="col"><h3><svg viewBox="0 0 64 64">${I[SPG[Object.keys(SPG).find(k=>norm(k)===norm(g.n))]]||I.BOOK}</svg>${esc(g.n)}</h3>`+g.l.map(s=>{const st=s.p.map(pst);const lib=st.filter(x=>x.k==="libre").length;return `<button class="suj" data-sp="${SP.indexOf(s)}"><b>${esc(s.t)}</b><span class="dots">${st.map(x=>`<span class="dot d-${x.k}" title="${x.l}"></span>`).join("")}<i>${lib}/${st.length} libres</i></span></button>`}).join("")+`</div>`).join("")+`</div>`}
function pubCard(p,f){return `${p.id?`<a class="card" target="_parent" data-wb href="${WB}/app/post/${p.id}">`:`<button class="card" data-pub="${esc(p.t)}">`}<div class="thumb" style="background:${gradOf(f[0])}"><svg viewBox="0 0 64 64">${iconOf(f[0])}</svg><span class="badge" style="color:var(--pub)">Publiée</span></div><div class="cb"><b>${esc(p.t)}</b><span class="small">${esc(p.a)} · ${esc(p.d)}</span></div>${p.id?"</a>":"</button>"}`}
function topicCard(f){const pb=PUBBY[f[0]];return `<button class="card" data-topic="${f[0]}"><div class="thumb" style="background:${gradOf(f[0].split("-").slice(0,3).join("-"))}"><svg viewBox="0 0 64 64">${iconOf(f[0])}</svg><span class="badge" style="color:${pb?"var(--pub)":"var(--libre)"}">${pb?"Publiée":"Libre"}</span></div><div class="cb"><b>${esc(f[1])}</b><div class="chips"><span class="chip">${LV[f[2]]}</span><span class="chip">${esc(f[3])}</span></div></div></button>`}
function findTopic(code){let r=null;(function w(n,p){if(r)return;if(Array.isArray(n)){if(n[0]===code)r={f:n,path:p};return}n.k.forEach(c=>w(c,[...p,n.c]))})({k:TREE,c:null},[]);if(r)r.path=r.path.slice(1);return r}
function renderSP(){const s=SP[S.sel.i],st=s.p.map(pst),lib=st.filter(x=>x.k==="libre").length;
 let h=crumb(nodeAt(S.path))+`<div class="fiche"><div class="hd"><span class="tag">${esc(s.d)}</span><span class="small">${lib}/${st.length} pistes libres</span></div><h2>${esc(s.t)}</h2>${s.ds?`<p style="margin:0">${esc(s.ds)}</p>`:""}<p class="lab">Sujets que l’on peut traiter — engage-toi sur une piste</p>`+
 s.p.map((p,i)=>{const x=st[i];return `<div class="piste"><span class="n">${i+1}</span><div><h4>${esc(p[0])}</h4><p>${esc(p[1])}</p></div><div class="side"><span class="st ${x.k}">${x.l}</span>${x.k==="libre"?`<button class="btn" data-take="${i}">Je prends cette piste</button>`:x.k==="cours"?`<button class="btn o" data-depot="${i}">Déposer le livrable</button>`:x.k==="pub"&&x.pub.id?`<a class="btn o" target="_parent" data-wb href="${WB}/app/post/${x.pub.id}">Voir la formation</a>`:""}</div></div>`}).join("")+
 `<button class="linkb" data-propose style="align-self:flex-start">＋ Proposer une piste, un cas pratique ou une modification</button>`+
 (s.c.length?`<p class="lab">Cas pratique possible — engage-toi</p>`+s.c.map((c,i)=>`<div class="piste"><span class="n">C${i+1}</span><div><h4>${esc(c[0])}</h4>${c[1]?`<p>${esc(c[1])}</p>`:""}</div><div class="side"><span class="st ${(c[2]||"").toLowerCase().includes("cours")?"cours":"libre"}">${(c[2]||"").toLowerCase().includes("cours")?"En cours":"Libre"}</span><button class="btn" data-takec="${i}">Je prends ce cas</button></div></div>`).join(""):"")+
 (s.l?`<p class="lab">Livrables possibles</p><div class="chips">${s.l.split(/\n|;|,(?![^()]*\))/).map(x=>x.trim()).filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:"")+
 (s.so?`<p class="lab">Sources</p><div class="src small">${esc(s.so).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>').replace(/\n/g,"<br>")}</div>`:"")+
 `<button class="linkb" data-back style="align-self:flex-start">← Retour à la carte</button></div>`;
 $("#main").innerHTML=h;bind();
 document.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>ticket("Je prends la piste : "+s.p[+b.dataset.take][0],s.t,"Prise de piste"));
 document.querySelectorAll("[data-depot]").forEach(b=>b.onclick=()=>ticket("Dépôt de livrable : "+s.p[+b.dataset.depot][0],s.t,"Dépôt de livrable"));
 document.querySelectorAll("[data-takec]").forEach(b=>b.onclick=()=>ticket("Je prends le cas pratique : "+s.c[+b.dataset.takec][0],s.t,"Prise de piste"));
}
function renderDetail(){const s=S.sel,ns=nodeAt(S.path),theme=ns[ns.length-1],fam=ns[1]||ns[0];let h=crumb(ns)+`<div class="fiche">`;
 if(s.kind==="pub"){h+=`<div class="hd"><span class="tag">${esc(theme.n)}</span><span class="small">Publiée le ${esc(s.p.d)} par ${esc(s.p.a)}</span></div><h2>${esc(s.p.t)}</h2>${s.p.r?`<p style="margin:0">${esc(s.p.r)}</p>`:""}<div class="box"><b>Niveau :</b> ${LV[s.f[2]]} · <b>Durée :</b> à compléter · <b>Format :</b> à compléter</div><div style="display:flex;gap:8px;flex-wrap:wrap">${s.p.id?`<a class="btn" target="_parent" data-wb href="${WB}/app/post/${s.p.id}">Ouvrir la formation</a>`:""}<button class="btn o" data-ask>Demander cette formation</button></div>`}
 else{const f=s.f,pb=PUBBY[f[0]];h+=`<div class="hd"><span class="tag">${esc(theme.n)}</span><span class="st ${pb?"pub":"libre"}">${pb?"Publiée":"Libre"}</span><span class="small">${esc(f[0])}</span></div><h2>${esc(f[1])}</h2><div class="box"><b>Niveau :</b> ${LV[f[2]]} · <b>Type :</b> ${esc(f[3])}</div>${fam&&fam.j?`<p style="margin:0"><b>Profils concernés :</b> ${esc(fam.j)}</p>`:""}${theme.o?`<p class="small" style="margin:0">Outils : ${esc(theme.o)}${theme.no&&theme.no.trim()?" · Normes : "+esc(theme.no):""}</p>`:""}<div>${pb&&pb[0].id?`<a class="btn o" target="_parent" data-wb href="${WB}/app/post/${pb[0].id}">Voir la formation</a>`:`<button class="btn" data-give>Je veux transmettre ce sujet</button>`}</div>`}
 h+=`<button class="linkb" data-back style="align-self:flex-start">← Retour</button></div>`;$("#main").innerHTML=h;bind();
 const ask=$("[data-ask]");if(ask)ask.onclick=()=>ticket("Demande de formation : "+s.p.t,theme.n,"Demande de formation");
 const give=$("[data-give]");if(give)give.onclick=()=>ticket("Je veux transmettre : "+s.f[1]+" ("+s.f[0]+")",theme.n,"Proposition de sujet");
}
function renderSearch(){const q=norm(S.q);let h=`<h2 class="sec">Recherche « ${esc(S.q)} »</h2>`;
 if(S.mode==="formations"){const r=PUB.filter(p=>norm(p.t).includes(q));h+=r.length?`<div class="grid">${r.map(p=>pubCard(p,findTopic(p.ref).f)).join("")}</div>`:`<p class="intro">Aucune formation publiée ne correspond.</p>`}
 else{const sp=SP.map((s,i)=>({s,i})).filter(({s})=>norm(s.t+" "+s.d+" "+s.p.map(p=>p[0]).join(" ")).includes(q));const all=[];(function w(n){if(Array.isArray(n)){all.push(n);return}n.k.forEach(w)})({k:TREE});const r=all.filter(f=>norm(f[0]+" "+f[1]).includes(q));
  if(sp.length)h+=`<p class="lab">Carte des sujets</p><div class="carte" style="margin:8px 0 18px">`+sp.map(({s,i})=>{const st=s.p.map(pst);return `<button class="suj" data-sp="${i}"><b>${esc(s.t)}</b><span class="dots">${st.map(x=>`<span class="dot d-${x.k}"></span>`).join("")}<i>${esc(s.d)}</i></span></button>`}).join("")+`</div>`;
  h+=`<p class="lab">Référentiel (${r.length})</p><div class="grid" style="margin-top:8px">${r.slice(0,48).map(topicCard).join("")}</div>`}
 $("#main").innerHTML=h;bind();}
const BOARD="07b46184-7db5-44a0-8cd2-3559a0e984cd";
function ticket(title,ctx,cat){const dep=cat==="Dépôt de livrable",desc="Sujet : "+ctx+"\nCatégorie : "+cat+"\n"+(dep?"Livrable joint : \n":"Disponibilité / intercontrat : \n")+"Commentaire : ";
$("#layer").innerHTML=`<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt"><header><h3 id="mt">${dep?"Déposer mon livrable":cat==="Prise de piste"?"Je prends ce sujet":"Proposer un sujet"}</h3><button class="linkb" data-x aria-label="Fermer" style="text-decoration:none;font-size:22px">×</button></header><div class="bd"><div class="note">${dep?"Le dépôt se fait dans un ticket Wobee : joins ton support au ticket, un référent le valide, puis il est publié en actualité dans la Bibliothèque.":"Ça passe par un ticket Wobee : le référent formation valide, puis la piste passe « En cours » sur la carte."}</div><div class="f"><label for="t1">Titre du ticket</label><input id="t1" value="${esc(title)}"></div><div class="f"><label for="t2">Description</label><textarea id="t2">${esc(desc)}</textarea></div><ol class="small" style="margin:0;padding-left:18px"><li>Clique sur « Copier et ouvrir Tickets formation »</li><li>Clique sur « Nouveau ticket » et colle le texte${dep?", ajoute ton livrable en pièce jointe":""}</li><li>Choisis la catégorie « ${esc(cat)} » et enregistre</li></ol></div><footer><button class="btn o" data-x type="button">Annuler</button><a class="btn" id="go" target="_parent" href="${WB}/app/board/${BOARD}">Copier et ouvrir Tickets formation</a></footer></div>`;
document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>$("#layer").innerHTML="");
$("#go").addEventListener("click",()=>{const t=$("#t1").value+"\n\n"+$("#t2").value;try{const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}catch(e){}});place();$("#t1").focus({preventScroll:true})}
function suivi(){const mine=SP.flatMap(s=>s.p.map(p=>({s,p,x:pst(p)})));const col=k=>mine.filter(m=>m.x.k===k).slice(0,4).map(m=>`<div class="it">${esc(m.p[0])}<br><span class="small">${esc(m.s.t)}</span></div>`).join("")||`<span class="small">Rien pour l’instant</span>`;
 $("#layer").innerHTML=`<div class="scrim" data-x></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="ms"><header><h3 id="ms">Tableau de suivi des pistes</h3><button class="linkb" data-x aria-label="Fermer" style="text-decoration:none;font-size:22px">×</button></header><div class="bd"><div class="note">Aperçu : en version finale, chaque consultant voit ici ses pistes, comme dans un tableau de tickets.</div><div class="kan"><div><h5><span class="dot d-cours"></span> En cours</h5>${col("cours")}</div><div><h5><span class="dot d-livree"></span> Livrée</h5>${col("livree")}</div><div><h5><span class="dot d-validee"></span> Publiée</h5>${col("pub")}</div></div></div><footer><button class="btn o" data-x>Fermer</button><a class="btn" target="_parent" href="${WB}/app/board/${BOARD}">Ouvrir Tickets formation</a></footer></div>`;document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>$("#layer").innerHTML="");place()}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;d.style.top=Math.max(16,LY-40)+"px";document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}
function bind(){
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.path.push(b.dataset.open);S.lv="";render();toTop()});
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.path=S.path.slice(0,+b.dataset.go+1);S.sel=null;render()});
 document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;render()});
 document.querySelectorAll("[data-switch]").forEach(b=>b.onclick=()=>setMode(b.dataset.switch,true));
 document.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{S.path=[];S.sel={kind:"sp",i:+b.dataset.sp,title:SP[+b.dataset.sp].t};clearQ();render();toTop()});
 document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{const r=findTopic(b.dataset.topic);S.path=r.path.filter(Boolean);S.sel={kind:"topic",f:r.f,title:r.f[1]};clearQ();render();toTop()});
 document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>{const p=PUB.find(x=>(x.id||x.t)===b.dataset.pub);const r=findTopic(p.ref);S.path=r.path.filter(Boolean);S.sel={kind:"pub",p,f:r.f,title:p.t};clearQ();render();toTop()});
 document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>{S.sel=null;render()});
 document.querySelectorAll("[data-propose]").forEach(b=>b.onclick=()=>ticket("Proposition de sujet : ","Apprendre et transmettre","Proposition de sujet"));
 document.querySelectorAll("[data-depotg]").forEach(b=>b.onclick=()=>ticket("Dépôt de livrable : ","Apprendre et transmettre","Dépôt de livrable"));
 document.querySelectorAll("[data-free]").forEach(b=>b.onclick=()=>{S.free=b.dataset.free==="1";render()});
 document.querySelectorAll("[data-suivi]").forEach(b=>b.onclick=suivi);
}
function clearQ(){S.q="";$("#q").value=""}
function toTop(){window.scrollTo({top:0,behavior:"smooth"})}
function setMode(m,keep){S.mode=m;S.sel=null;if(!keep)S.path=[];S.lv="";history.replaceState(null,"","#"+m);render()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim();S.sel=null;render()});
render();
</script></body></html>
