<style>
:root{--bg:#ffffff;--ink:#1e1d3a;--muted:#6b6a86;--line:#e4e3ee;--soft:#f6f5fa;--navy:#2c2b55;--a1:#f47b3e;--ok:#1f8a62;--okbg:#e3f5ec;--todo:#8a6d00;--todobg:#fff4cc;

*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Outfit","Segoe UI",system-ui,sans-serif;font-size:14px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.wrap{padding:6px 4px 30px;max-width:1200px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--soft)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.search{flex:1 1 260px;max-width:420px;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit}
h1{font-size:30px;line-height:1.1;font-weight:600;margin:14px 0 4px;text-wrap:balance}
.intro{color:var(--muted);max-width:75ch;margin:0}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin:12px 0 16px}
.crumb button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:2px}
.crumb span:last-child{color:var(--ink);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.card:hover{box-shadow:0 6px 18px rgba(44,43,85,.12)}
.vis{aspect-ratio:2/1;display:grid;place-items:center;position:relative}
.vis svg{width:34%;max-height:64%;fill:none;stroke-width:1.5}
.vis .code{font-family:"JetBrains Mono",monospace;font-size:11px;opacity:.75;position:absolute;left:10px;bottom:8px}
.badge{position:absolute;top:10px;right:10px;font-size:11px;font-weight:600;border-radius:6px;padding:1px 8px}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.todo{background:var(--todobg);color:var(--todo)}
.cb{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:15px;font-weight:600;margin:0;line-height:1.3}
.cb .desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:999px;font-size:11.5px;padding:2px 9px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.filters button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:12.5px}
.filters button[aria-pressed="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
.empty{padding:28px;border:1px dashed var(--line);border-radius:14px;color:var(--muted);text-align:center}
.empty button{margin-top:10px}
.btn{border:0;background:var(--navy);color:#fff;border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;text-decoration:none;display:inline-block}
.btn.o{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.panel{border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:6px;display:flex;flex-direction:column;gap:12px;max-width:820px}
.panel h2{margin:0;font-size:24px;line-height:1.2}
.alert{background:#eaf2ff;border-left:3px solid #9cb8ee;border-radius:8px;padding:10px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px 14px}
.alert dt{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}.alert dd{margin:0;font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px}
.msg{font-size:13px;color:var(--muted)}
.count{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}

const PUB=[{"t": "Vannes de contrôle : fonctionnement et dimensionnement", "ref": "EI-PRO-DIM-008", "a": "Charline AJACQUES", "d": "04/11/2026", "r": "Rôle, choix et dimensionnement des vannes de contrôle dans les procédés industriels (régulation, instrumentation).", "id": "f93edf43-0b46-4e42-b9b9-b803c368e406"}, {"t": "Du puits au pétrole exporté : les étapes de production", "ref": "EI-OG-AMO-004", "a": "Charline AJACQUES", "d": "04/11/2026", "r": ""}, {"t": "Hydrates, paraffines et bouchons liquides", "ref": "EI-OG-AMO-005", "a": "Céline CAI", "d": "05/11/2026", "r": "", "id": "00774c38-c1b7-470f-8603-2d90ee03f0d2"}, {"t": "Comportement vibratoire : les bases des vibrations mécaniques", "ref": "EI-MEC-CAL-009", "a": "Céline CAI", "d": "06/11/2026", "r": ""}];
const LV={F:"Fondamentaux",A:"Avancé",E:"Expert"};
const ICONS={EI:'<path d="M6 40V18h8v22M14 40V10h8v30M22 40V24h20v16M30 24v-6h6v6M4 40h40"/><circle cx="36" cy="12" r="3"/>',IC:'<path d="M4 34h40M8 34l6-20h20l6 20M14 14l-2 20M34 14l2 20M20 14v20M28 14v20M4 40h40"/>',TR:'<circle cx="24" cy="16" r="7"/><path d="M10 40c2-8 8-12 14-12s12 4 14 12"/><path d="M36 8l4-4M40 12h4"/>'};
const PUBBY={};PUB.forEach(p=>{(PUBBY[p.ref]=PUBBY[p.ref]||[]).push(p)});
let S={mode:(location.hash||"#formations").slice(1)==="apprendre"?"apprendre":"formations",path:[],sel:null,lv:"",q:""};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dom=c=>c.split("-")[0];
function items(n){if(Array.isArray(n))return[n];return n.k.flatMap(items)}
function pubIn(n){return items(n).reduce((a,f)=>a+(PUBBY[f[0]]||[]).length,0)}
function nodeAt(path){let lvl=TREE,out=[];for(const c of path){const n=lvl.find(x=>x.c===c);if(!n)break;out.push(n);lvl=n.k}return out}
function vis(code,badge){const d=dom(code);return `<div class="vis" style="background:var(--t-${d});color:var(--i-${d})"><svg viewBox="0 0 48 48" stroke="currentColor">${ICONS[d]}</svg><span class="code">${esc(code)}</span>${badge||""}</div>`}
function crumb(ns){let h=`<nav class="crumb"><button data-go="-1">${S.mode==="formations"?"Formations":"Apprendre et transmettre"}</button>`;ns.forEach((n,i)=>{h+=`<span>›</span>`+(i<ns.length-1||S.sel?`<button data-go="${i}">${esc(n.n)}</button>`:`<span>${esc(n.n)}</span>`)});if(S.sel)h+=`<span>›</span><span>${esc(S.sel.t)}</span>`;return h+"</nav>"}
function render(){
 document.querySelectorAll(".seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.mode));
 if(S.q)return renderSearch();
 if(S.sel)return renderDetail();
 const ns=nodeAt(S.path),cur=ns[ns.length-1],kids=cur?cur.k:TREE,leaf=kids.length&&Array.isArray(kids[0]);
 const F=S.mode==="formations";
 let h=`<h1>${esc(cur?cur.n:(F?"Formations Madeca":"Apprendre et transmettre"))}</h1><p class="intro">${esc(cur&&cur.d?cur.d:(!cur?(F?"Les formations déjà publiées, rangées par domaine et par métier.":"Toutes les formations possibles du référentiel Madeca. Choisis un sujet que tu maîtrises et propose de le transmettre."):""))}</p>`+crumb(ns);
 if(!leaf){
  h+=`<div class="grid">`+kids.map(k=>{const p=pubIn(k),t=items(k).length;const sub=F?`${p} formation${p>1?"s":""} publiée${p>1?"s":""}`:`${t} sujets · ${p} déjà publié${p>1?"s":""}`;return `<button class="card" data-open="${k.c}">${vis(k.c,p&&!F?`<span class="badge ok">${p} publiée${p>1?"s":""}</span>`:"")}<div class="cb"><h3>${esc(k.n)}</h3>${k.d?`<div class="desc">${esc(k.d)}</div>`:""}<div class="meta count">${sub}</div></div></button>`}).join("")+`</div>`;
 }else{
  if(F){
   const list=kids.flatMap(f=>(PUBBY[f[0]]||[]).map(p=>({p,f})));
   h+=list.length?`<div class="grid">`+list.map(({p,f})=>pubCard(p,f)).join("")+`</div>`:`<div class="empty">Aucune formation publiée dans ce thème pour l’instant.<br><button class="btn o" data-switch="apprendre">Voir les sujets à transmettre</button></div>`;
  }else{
   h+=`<div class="filters" role="group" aria-label="Niveau">`+["","F","A","E"].map(l=>`<button data-lv="${l}" aria-pressed="${S.lv===l}">${l?LV[l]:"Tous niveaux"}</button>`).join("")+`</div>`;
   const list=kids.filter(f=>!S.lv||f[2]===S.lv);
   h+=`<div class="grid">`+list.map(f=>topicCard(f)).join("")+`</div>`;
  }
 }
 $("#main").innerHTML=h;bind();
}
function pubCard(p,f){return `<button class="card" data-pub="${p.id||p.t}">${vis(f[0],'<span class="badge ok">Publiée</span>')}<div class="cb"><h3>${esc(p.t)}</h3><div class="meta">${esc(p.a)} · ${esc(p.d)}</div></div></button>`}
function topicCard(f){const pb=PUBBY[f[0]];return `<button class="card" data-topic="${f[0]}">${vis(f[0],pb?'<span class="badge ok">Publiée</span>':'<span class="badge todo">À créer</span>')}<div class="cb"><h3>${esc(f[1])}</h3><div class="chips"><span class="chip">${LV[f[2]]}</span><span class="chip">${esc(f[3])}</span></div></div></button>`}
function findTopic(code){let r=null;(function w(n,p){if(r)return;if(Array.isArray(n)){if(n[0]===code)r={f:n,path:p};return}n.k.forEach(c=>w(c,[...p,n.c]))})({k:TREE,c:null},[]);if(r)r.path=r.path.slice(1);return r}
function renderDetail(){
 const s=S.sel,ns=nodeAt(S.path),theme=ns[ns.length-1],fam=ns[1]||ns[0];
 let h=crumb(ns)+`<div class="panel">`;
 if(s.kind==="pub"){
  h+=`<span class="meta">Publiée le ${esc(s.p.d)} par ${esc(s.p.a)}</span><h2>${esc(s.p.t)}</h2>${s.p.r?`<p style="margin:0">${esc(s.p.r)}</p>`:""}<dl class="alert"><div><dt>Thème</dt><dd>${esc(theme.n)}</dd></div><div><dt>Niveau</dt><dd>${LV[s.f[2]]}</dd></div><div><dt>Durée</dt><dd>à compléter</dd></div></dl><div class="row">${s.p.id?`<a class="btn" target="_blank" rel="noopener" href="https://madeca.wobee.fr/app/post/${s.p.id}">Ouvrir la formation</a>`:""}<button class="btn o" data-ask>Demander cette formation</button><button class="btn o" data-back>Retour</button></div><p class="msg" id="msg"></p>`;
 }else{
  const f=s.f,pb=PUBBY[f[0]];
  h+=`<span class="meta">${esc(f[0])} · ${pb?"Formation publiée":"Formation à créer"}</span><h2>${esc(f[1])}</h2><dl class="alert"><div><dt>Niveau</dt><dd>${LV[f[2]]}</dd></div><div><dt>Type</dt><dd>${esc(f[3])}</dd></div><div><dt>Thème</dt><dd>${esc(theme.n)}</dd></div></dl>`+
  (fam&&fam.j?`<p style="margin:0"><b style="font-weight:600">Profils concernés :</b> ${esc(fam.j)}</p>`:"")+(theme.o?`<p class="msg" style="margin:0">Outils : ${esc(theme.o)}${theme.no?" · Normes : "+esc(theme.no):""}</p>`:"")+
  (pb?pb.map(p=>`<p style="margin:0">Déjà publiée : <b style="font-weight:600">${esc(p.t)}</b> (${esc(p.a)})</p>`).join(""):"")+
  `<div class="row">${pb&&pb[0].id?`<a class="btn" target="_blank" rel="noopener" href="https://madeca.wobee.fr/app/post/${pb[0].id}">Ouvrir la formation</a>`:`<button class="btn" data-give>Je veux transmettre ce sujet</button>`}<button class="btn o" data-back>Retour</button></div><p class="msg" id="msg"></p>`;
 }
 $("#main").innerHTML=h+`</div>`;bind();
}
function renderSearch(){
 const q=S.q;const all=[];(function w(n,p){if(Array.isArray(n)){all.push({f:n,path:p});return}n.k.forEach(c=>w(c,[...p,n.c]))})({k:TREE,c:"_"},[]);
 let res;if(S.mode==="formations"){res=PUB.filter(p=>(p.t+" "+p.ref).toLowerCase().includes(q)).map(p=>({p,...findTopic(p.ref)}))}else{res=all.filter(x=>(x.f[0]+" "+x.f[1]).toLowerCase().includes(q))}
 let h=`<h1>Recherche</h1><p class="intro count">${res.length} résultat${res.length>1?"s":""} pour « ${esc(q)} »</p><div style="height:14px"></div>`;
 h+=res.length?`<div class="grid">`+res.slice(0,60).map(r=>S.mode==="formations"?pubCard(r.p,r.f):topicCard(r.f)).join("")+`</div>`:`<div class="empty">Rien trouvé.</div>`;
 if(res.length>60)h+=`<p class="msg">60 premiers résultats affichés, affine ta recherche.</p>`;
 $("#main").innerHTML=h;bind(true);
}
function bind(fromSearch){
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{S.path.push(b.dataset.open);S.lv="";render();toTop()});
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{S.path=S.path.slice(0,+b.dataset.go+1);S.sel=null;render()});
 document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{S.lv=b.dataset.lv;render()});
 document.querySelectorAll("[data-switch]").forEach(b=>b.onclick=()=>setMode(b.dataset.switch,true));
 document.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{const r=findTopic(b.dataset.topic);S.path=r.path.filter(Boolean);S.sel={kind:"topic",f:r.f};clearQ();render();toTop()});
 document.querySelectorAll("[data-pub]").forEach(b=>b.onclick=()=>{const p=PUB.find(x=>(x.id||x.t)===b.dataset.pub);const r=findTopic(p.ref);S.path=r.path.filter(Boolean);S.sel={kind:"pub",p,f:r.f};clearQ();render();toTop()});
 const back=$("[data-back]");if(back)back.onclick=()=>{S.sel=null;render()};
 const ask=$("[data-ask]");if(ask)ask.onclick=()=>{$("#msg").textContent="Version test : la demande passera par Madeca Formation › Tickets formation."};
 const give=$("[data-give]");if(give)give.onclick=()=>{$("#msg").textContent="Version test : ta proposition sera envoyée à l’équipe formation, avec le code "+S.sel.f[0]+"."};
}
function clearQ(){S.q="";$("#q").value=""}
function toTop(){window.scrollTo({top:0,behavior:"smooth"})}
function setMode(m,keepPath){S.mode=m;S.sel=null;if(!keepPath)S.path=[];S.lv="";history.replaceState(null,"","#"+m);render()}
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>setMode(b.dataset.m));
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim().toLowerCase();S.sel=null;render()});
window.addEventListener("hashchange",()=>{const m=location.hash.slice(1);if(m==="apprendre"||m==="formations")setMode(m)});
render();
</script></body></html>
